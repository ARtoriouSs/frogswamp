# `device` is towel_master, towel_guest, floor_master or floor_guest
#
# A run is a lease: a timer that turns the heater off when it ends. Automations only ever ask for one, so they
# can't turn off a heater someone else is using. A heater turned on by hand has no lease and runs until it is
# turned off by hand. Only the end of a lease, the button, a manual off and Vacation turn a heater off

# For automations. Starts a lease if the heater is off, extends a running one if this one ends later,
# never shortens it. A heater that is on without a lease was turned on by hand, so it's left alone
heat_lease:
  alias: "Timed heat: ask for a lease"
  icon: mdi:timer-plus-outline
  mode: parallel
  fields:
    device:
      required: true
      example: floor_master
    duration:
      description: Length of the lease, 3 h if not set
      example: "03:00:00"
  variables:
    length: "{{ duration | default('03:00:00') }}"
    timer_id: "timer.heat_{{ device }}"
    off_sensor: "binary_sensor.heat_off_{{ device }}"
  sequence:
    - choose:
        - conditions: "{{ is_state(timer_id, 'active') }}"
          sequence:
            - if: >-
                {{ (as_datetime(state_attr(timer_id, 'finishes_at')) - now()).total_seconds()
                   < as_timedelta(length).total_seconds() }}
              then:
                - action: timer.start
                  target:
                    entity_id: "{{ timer_id }}"
                  data:
                    duration: "{{ length }}"
        - conditions: "{{ is_state(off_sensor, 'on') }}"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: "input_boolean.heat_run_{{ device }}"
            - action: switch.turn_on
              target:
                entity_id: >-
                  {{ {'towel_master': 'switch.master_bathroom_towel_heat_relay',
                      'towel_guest': 'switch.guest_towel_heat',
                      'floor_master': 'switch.master_floor_warming',
                      'floor_guest': 'switch.guest_floor_warming'}[device] }}
            - action: timer.start
              target:
                entity_id: "{{ timer_id }}"
              data:
                duration: "{{ length }}"

# The button. Starts a lease even if the heater is on by hand, or ends the one in progress and turns it off
heat_timed_press:
  alias: "Timed heat: button"
  icon: mdi:timer-outline
  mode: parallel
  fields:
    device:
      required: true
      example: towel_master
  sequence:
    - if: "{{ is_state('timer.heat_' ~ device, 'active') }}"
      then:
        - action: timer.cancel
          target:
            entity_id: "timer.heat_{{ device }}"
        - action: script.turn_on
          target:
            entity_id: script.heat_timed_off
          data:
            variables:
              device: "{{ device }}"
      else:
        # An offline heater wouldn't start, so no countdown for it. The card says Offline
        - condition: template
          value_template: "{{ states('binary_sensor.heat_off_' ~ device) not in ['unavailable', 'unknown'] }}"
        - action: input_boolean.turn_on
          target:
            entity_id: "input_boolean.heat_run_{{ device }}"
        - action: switch.turn_on
          target:
            entity_id: >-
              {{ {'towel_master': 'switch.master_bathroom_towel_heat_relay',
                  'towel_guest': 'switch.guest_towel_heat',
                  'floor_master': 'switch.master_floor_warming',
                  'floor_guest': 'switch.guest_floor_warming'}[device] }}
        - action: timer.start
          target:
            entity_id: "timer.heat_{{ device }}"

# Tries every 5 min for a day until the device confirms it. Tells the phone after 30 min, and again when it worked
heat_timed_off:
  alias: "Timed heat: turn off with retries"
  icon: mdi:radiator-off
  mode: parallel
  fields:
    device:
      required: true
      example: towel_master
  variables:
    heater: >-
      {{ {'towel_master': 'switch.master_bathroom_towel_heat_relay',
          'towel_guest': 'switch.guest_towel_heat',
          'floor_master': 'switch.master_floor_warming',
          'floor_guest': 'switch.guest_floor_warming'}[device] }}
    label: >-
      {{ {'towel_master': 'Master towel heat',
          'towel_guest': 'Guest towel heat',
          'floor_master': 'Master floor warming',
          'floor_guest': 'Guest floor warming'}[device] }}
    confirmed: "binary_sensor.heat_off_{{ device }}"
  sequence:
    - repeat:
        count: 288
        sequence:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ heater }}"
          - wait_template: "{{ is_state(confirmed, 'on') }}"
            timeout: "00:05:00"
            continue_on_timeout: true
          - if: "{{ wait.completed }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.heat_run_{{ device }}"
              - if: "{{ repeat.index > 6 }}"
                then:
                  - action: notify.mobile_app_pixel_7
                    data:
                      title: "{{ label }} is off now"
                      message: The timed run ended earlier, the device confirmed only now
                      data:
                        tag: "heat-off-{{ device }}"
              - stop: Confirmed off
          - if: "{{ repeat.index == 6 }}"
            then:
              - action: notify.mobile_app_pixel_7
                data:
                  title: "{{ label }} didn't turn off"
                  message: "Its timed run ended, but it's {{ 'offline' if states(confirmed) in ['unavailable', 'unknown'] else 'still on' }} after 30 min of tries. Still trying for a day, check it"
                  data:
                    tag: "heat-off-{{ device }}"
    - action: notify.mobile_app_pixel_7
      data:
        title: "{{ label }} still not off"
        message: A day of tries didn't help, HA stopped trying. Turn it off by hand
        data:
          tag: "heat-off-{{ device }}"
