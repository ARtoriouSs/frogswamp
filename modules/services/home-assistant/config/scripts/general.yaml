# automations/movie_mode.yaml runs these when the TV turns on or off by any means, so a run from
# here runs twice. Keep both safe to repeat: turning on a TV that is already on does nothing
tv_mode:
  alias: "Movie mode"
  icon: mdi:television-play
  mode: single
  sequence:
    - action: remote.turn_on
      target:
        entity_id: remote.living_room_philips_tv

tv_mode_off:
  alias: "Movie mode off"
  icon: mdi:television-off
  mode: single
  sequence:
    - action: remote.turn_off
      target:
        entity_id: remote.living_room_philips_tv

# TV and PS5 on. HA skips a turn on for an unavailable switch without an error, so say it here:
# the voice assistant must not report that the PS5 is on
game_mode:
  alias: "Game mode"
  icon: mdi:sony-playstation
  mode: single
  sequence:
    - action: remote.turn_on
      target:
        entity_id: remote.living_room_philips_tv
    - if: "{{ not has_value('switch.ps5_120_power') }}"
      then:
        - stop: "The PS5 is fully off or not reachable"
          error: true
    - action: switch.turn_on
      target:
        entity_id: switch.ps5_120_power
