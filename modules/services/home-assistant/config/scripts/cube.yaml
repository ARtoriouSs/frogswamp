# An event animation on the cube. In the quiet mode (night, Vacation or nobody home) it plays at 100%,
# then the brightness goes down to 0% again, only if the cube is still in the quiet mode at the end.
# A new event stops the one in progress
cube_event:
  alias: "Cube: event animation"
  icon: mdi:animation-play
  mode: restart
  fields:
    preset:
      required: true
      selector:
        text:
    repeat:
      default: 1
      selector:
        text:
    duration:
      required: true
      selector:
        number:
          min: 0.1
          max: 3600
          step: 0.1
          unit_of_measurement: s
  sequence:
    - variables:
        cube: light.cube_matrix_192_168_101_121
        quiet: "{{ is_state('binary_sensor.vacation_active', 'on') or is_state('input_boolean.cube_night', 'on') or is_state('input_boolean.nobody_home', 'on') }}"
    - if: "{{ quiet }}"
      then:
        - action: script.cube_brightness_on
    - action: cubematrix.show
      target:
        entity_id: "{{ cube }}"
      data:
        preset: "{{ preset }}"
        repeat: "{{ repeat | default(1) }}"
        duration: "{{ duration }}"
        wake: true
        wait: true
        # Hold keeps the last event frame until the brightness is down, so the dot doesn't flash bright
        then: "{{ 'hold' if quiet else 'restore' }}"
    - if: "{{ is_state('binary_sensor.vacation_active', 'on') or is_state('input_boolean.cube_night', 'on') or is_state('input_boolean.nobody_home', 'on') }}"
      then:
        - action: script.cube_brightness_off
    - if: "{{ quiet }}"
      then:
        - action: cubematrix.stop
          target:
            entity_id: "{{ cube }}"

# 0% in HA. The raw value is 1 of 255: 0 would turn the light off, and the lamp can't stay off,
# so this is its "off"
cube_brightness_off:
  alias: "Cube: brightness 0%"
  icon: mdi:brightness-1
  mode: queued
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        brightness: 1

cube_brightness_on:
  alias: "Cube: brightness 100%"
  icon: mdi:brightness-7
  mode: queued
  sequence:
    - action: light.turn_on
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        brightness: 255

# The green dot at 0%
cube_sleep:
  alias: "Cube: green dot"
  icon: mdi:circle-small
  mode: queued
  sequence:
    - action: script.cube_brightness_off
    - action: cubematrix.set_background
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        preset: dot

# A random frog at 100%
cube_wake:
  alias: "Cube: frogs"
  icon: mdi:frog
  mode: queued
  sequence:
    - action: cubematrix.set_background
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        preset: >-
          {{ state_attr('select.cube_matrix_192_168_101_121_background', 'options')
             | select('match', '^frog_') | list | random }}
    - action: script.cube_brightness_on
