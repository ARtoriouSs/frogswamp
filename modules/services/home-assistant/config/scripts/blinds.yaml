# Living room blinds and bedroom curtains through Tuya Local, in place of the Tuya cloud scenes.
# The blinds' position in HA: 0 = drawn across the window (closed), 100 = gathered at the side (open).
# The Tuya app and its scenes count the other way (100% = drawn), Tuya Local's config inverts it.
# An open/close command without a position only turns the slats.
# The button scripts below start blinds_run and return at once. It starts one script per blind, each in
# restart mode: a new command stops only what its own blind is doing, and the blinds don't wait for each other
# (with the door open, the other two finish Reset long before it does)
blinds_run:
  alias: "Blinds: run a move"
  icon: mdi:blinds
  mode: parallel
  fields:
    move:
      description: full_close, open, full_close_open, open_door, close_door, slats_open or slats_close
      required: true
      example: full_close
  sequence:
    - repeat:
        for_each: "{{ ['left_door'] if move in ['open_door', 'close_door'] else ['left_door', 'middle', 'right'] }}"
        sequence:
          - action: script.turn_on
            target:
              entity_id: "script.blind_run_{{ repeat.item }}"
            data:
              variables:
                move: "{{ 'full_close_open' if move == 'close_door' else move }}"

blind_run_left_door:
  alias: "Blinds: run a move on left / door"
  icon: mdi:blinds
  mode: restart
  fields:
    move:
      required: true
      example: full_close
  variables:
    blind: cover.blinds_left_door_local
  sequence: &blind_sequence
    - choose:
        - conditions: "{{ move in ['full_close', 'open', 'full_close_open'] }}"
          sequence:
            # Read before the command: the position data point is also the target, so it can jump to 0 at once
            - variables:
                start: "{{ state_attr(blind, 'current_position') | int(100) }}"
            - action: cover.set_cover_position
              target:
                entity_id: "{{ blind }}"
              data:
                position: 0
            # One slat step after arriving: a blind that was already down barely moves, so its slats
            # stop a step short. The step stops a blind still on its way, and a report of 0 alone doesn't
            # prove arrival, so first wait the time this run needs: 0.47 s per percent, a full run is 40-47 s.
            # The timeout covers a blind that doesn't report 0.
            # Close + open waits 2 s instead of 0.75 s, to be sure the blind has settled
            - if: "{{ move in ['full_close', 'full_close_open'] }}"
              then:
                - delay:
                    milliseconds: "{{ start * 470 }}"
                - wait_template: "{{ state_attr(blind, 'current_position') == 0 }}"
                  timeout: "00:00:15"
                  continue_on_timeout: true
                - delay:
                    milliseconds: "{{ 2000 if move == 'full_close_open' else 750 }}"
                - action: cover.close_cover
                  target:
                    entity_id: "{{ blind }}"
            # Open: five slat steps, 0.75 s apart
            - if: "{{ move in ['open', 'full_close_open'] }}"
              then:
                - repeat:
                    count: 5
                    sequence:
                      - delay:
                          milliseconds: 750
                      - action: cover.open_cover
                        target:
                          entity_id: "{{ blind }}"
        # From closed the first command may only turn the slats, so it's sent again until the blind
        # really travels. Slat steps change the position by 1 or so. The position is reported every few s
        - conditions: "{{ move == 'open_door' }}"
          sequence:
            - variables:
                start: "{{ state_attr(blind, 'current_position') | int(0) }}"
            - repeat:
                count: 3
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: "{{ blind }}"
                    data:
                      position: 100
                  - wait_template: >-
                      {% set position = state_attr(blind, 'current_position') | int(0) %}
                      {{ position > start + 3 or position >= 99 }}
                    timeout: "00:00:08"
                    continue_on_timeout: true
                  - if: "{{ wait.completed }}"
                    then:
                      - stop: The blind is travelling
        - conditions: "{{ move in ['slats_open', 'slats_close'] }}"
          sequence:
            - action: "cover.{{ 'open' if move == 'slats_open' else 'close' }}_cover"
              target:
                entity_id: "{{ blind }}"

blind_run_middle:
  alias: "Blinds: run a move on middle"
  icon: mdi:blinds
  mode: restart
  fields:
    move:
      required: true
      example: full_close
  variables:
    blind: cover.blinds_middle_local
  sequence: *blind_sequence

blind_run_right:
  alias: "Blinds: run a move on right"
  icon: mdi:blinds
  mode: restart
  fields:
    move:
      required: true
      example: full_close
  variables:
    blind: cover.blinds_right_local
  sequence: *blind_sequence

# The balcony button: an open door blind gets a Reset of its own (closes, then the slats open),
# otherwise it opens fully, also from the middle
blinds_balcony_toggle:
  alias: "Blinds: toggle balcony"
  icon: mdi:door-open
  sequence:
    - if: "{{ state_attr('cover.blinds_left_door_local', 'current_position') | int(0) >= 95 }}"
      then:
        - action: script.blinds_close_door
      else:
        - action: script.blinds_open_door

blinds_close_door:
  alias: "Blinds: close door, slats open"
  icon: mdi:door-closed
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: close_door

blinds_full_close:
  alias: "Blinds: full close"
  icon: mdi:roller-shade-closed
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: full_close

blinds_open:
  alias: "Blinds: open"
  icon: mdi:roller-shade
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: open

blinds_full_close_open:
  alias: "Blinds: full close + open"
  icon: mdi:roller-shade
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: full_close_open

blinds_open_door:
  alias: "Blinds: open door"
  icon: mdi:door-open
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: open_door

blinds_slats_open:
  alias: "Blinds: slats ^"
  icon: mdi:blinds-open
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: slats_open

blinds_slats_close:
  alias: "Blinds: slats v"
  icon: mdi:blinds
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.blinds_run
      data:
        variables:
          move: slats_close

# The curtains through the cover that turns Tuya Local's upside down one the right way round
curtains_open:
  alias: "Curtains: open"
  icon: mdi:curtains
  sequence:
    - action: cover.open_cover
      target:
        entity_id: cover.bedroom_curtains_local

curtains_close:
  alias: "Curtains: close"
  icon: mdi:curtains-closed
  sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.bedroom_curtains_local
