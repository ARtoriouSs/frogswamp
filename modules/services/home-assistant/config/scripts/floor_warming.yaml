# Bathroom floors through Tuya Local, in place of the Tuya cloud scenes:
# the thermostat on in manual mode (heat), 30 °C for on, 18 °C for off.
# During Vacation off is the real off mode, so a cold room can't start the floor.
# Otherwise it also sets the sensor back to Internal, in case someone changed it on the screen
floor_warming_set:
  alias: "Floor warming: on or off"
  icon: mdi:heating-coil
  mode: parallel
  fields:
    bathroom:
      description: guest or master
      required: true
      example: guest
    state:
      description: on or off
      required: true
      example: "on"
  variables:
    thermostat: "climate.thermostat_{{ bathroom }}_local"
  sequence:
    - if: "{{ state == 'off' and is_state('input_boolean.vacation', 'on') }}"
      then:
        # 18 first, so it doesn't start at the old target when Vacation ends
        - action: climate.set_temperature
          continue_on_error: true
          target:
            entity_id: "{{ thermostat }}"
          data:
            temperature: 18
        - action: climate.set_hvac_mode
          target:
            entity_id: "{{ thermostat }}"
          data:
            hvac_mode: "off"
        - stop: Off for Vacation
    - action: select.select_option
      continue_on_error: true
      target:
        entity_id: "select.thermostat_{{ bathroom }}_local_temperature_sensor"
      data:
        option: Internal
    - action: climate.set_hvac_mode
      target:
        entity_id: "{{ thermostat }}"
      data:
        hvac_mode: heat
    - action: climate.set_temperature
      target:
        entity_id: "{{ thermostat }}"
      data:
        temperature: "{{ 30 if state == 'on' else 18 }}"

# Brightness of the thermostat screens, the values are in packages/thermostat_backlight.yaml
thermostat_backlight_set:
  alias: "Thermostat screens: set brightness"
  icon: mdi:brightness-6
  mode: queued
  fields:
    level:
      description: day, night or vacation
      required: true
      example: night
  sequence:
    - repeat:
        for_each:
          - guest
          - master
        sequence:
          - variables:
              percent: "{{ states('input_number.thermostat_backlight_' ~ repeat.item ~ '_' ~ level) | int(0) }}"
          - if: "{{ percent == 0 }}"
            then:
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: "light.thermostat_{{ repeat.item }}_local_backlight"
            else:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "light.thermostat_{{ repeat.item }}_local_backlight"
                data:
                  brightness_pct: "{{ percent }}"
