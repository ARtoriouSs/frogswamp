play_music:
  alias: "Play music"
  description: >-
    Plays music from Spotify through Music Assistant. `query` is an artist, album, track or
    playlist name in its original spelling (Metallica, not металлика). `player` is the media
    player to play on
  icon: mdi:music
  mode: parallel
  fields:
    query:
      name: Query
      description: Artist, album, track or playlist name in its original spelling
      required: true
      selector:
        text:
    player:
      name: Player
      description: Media player to play on
      required: true
      selector:
        entity:
          domain: media_player
  sequence:
    # a link would make Music Assistant fetch it from the server, so only names are played.
    # No \b in the pattern: Jinja turns it into a backspace inside a string
    - condition: template
      value_template: "{{ query is not search('(?i)(https?|ftps?|rtsps?|rtmps?|mms|wss?|sftp)://') }}"
    - action: music_assistant.play_media
      target:
        entity_id: "{{ player }}"
      data:
        media_id: "{{ query }}"
        enqueue: replace
