# The desk panel has two locks. The child lock ("---" on the display) still takes the "move to memory
# position" command that the Tuya scenes send. After a few idle minutes the display sleeps, and then the
# first command only wakes it up. So the scene is sent twice, 20 s apart: a sleeping desk wakes on the first
# and moves on the second, an awake one moves on the first and ignores the second (it's already there).
# Then the child lock goes off, so the height can be changed on the pad right away. The panel locks itself again
desk_move_with_unlock:
  alias: "Desk: move"
  icon: mdi:desk
  # A new press stops the move in progress, e.g. down while up is still waiting
  mode: restart
  fields:
    direction:
      description: up or down
      required: true
      selector:
        select:
          options:
            - up
            - down
  sequence:
    - action: scene.turn_on
      target:
        entity_id: "scene.office_desk_{{ direction }}"
    - delay: "00:00:20"
    - action: scene.turn_on
      target:
        entity_id: "scene.office_desk_{{ direction }}"
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id: switch.desk_child_lock

# For automations. Raises the desk for a time and lowers it when the time ends. A running lease is extended if
# this one ends later, never shortened, and the desk isn't sent up again. Does nothing while Aleksander is away
desk_lease:
  alias: "Desk: ask for a lease"
  icon: mdi:timer-plus-outline
  mode: parallel
  fields:
    duration:
      description: Length of the lease, 30 min if not set
      example: "00:30:00"
  variables:
    length: "{{ duration | default('00:30:00') }}"
  sequence:
    - condition: state
      entity_id: binary_sensor.desk_automations_allowed
      state: "on"
    - if: "{{ is_state('timer.desk_lease', 'active') }}"
      then:
        - if: >-
            {{ (as_datetime(state_attr('timer.desk_lease', 'finishes_at')) - now()).total_seconds()
               < as_timedelta(length).total_seconds() }}
          then:
            - action: timer.start
              target:
                entity_id: timer.desk_lease
              data:
                duration: "{{ length }}"
      else:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.desk_lease_run
        - action: timer.start
          target:
            entity_id: timer.desk_lease
          data:
            duration: "{{ length }}"
        - action: script.desk_move_with_unlock
          data:
            direction: up

# The buttons and NeonPlan. A press by hand ends the lease, so the desk stays where it was sent
desk_lease_cancel:
  alias: "Desk: end the lease"
  icon: mdi:timer-off-outline
  sequence:
    - action: timer.cancel
      target:
        entity_id: timer.desk_lease
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.desk_lease_run

desk_up:
  alias: "Desk: up"
  icon: mdi:arrow-up-bold
  sequence:
    - action: script.desk_lease_cancel
    - action: script.desk_move_with_unlock
      data:
        direction: up

desk_down:
  alias: "Desk: down"
  icon: mdi:arrow-down-bold
  sequence:
    - action: script.desk_lease_cancel
    - action: script.desk_move_with_unlock
      data:
        direction: down
