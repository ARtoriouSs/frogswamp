# The desk panel locks itself after about a minute of idle time and ignores commands while locked.
# The lock is the child lock switch, so turn it off first, then move. The panel locks itself again.
# If the lock doesn't turn off (e.g. Tuya cloud is slow), fall back to sending the move twice:
# the first one wakes the panel, the second one moves the desk
desk_move:
  alias: "Desk: move"
  mode: single
  fields:
    direction:
      description: up or down
      required: true
      selector:
        select:
          options:
            - up
            - down
  sequence:
    - variables:
        scene: "scene.office_desk_{{ direction }}"
    - if: "{{ not is_state('switch.desk_child_lock', 'off') }}"
      then:
        - action: switch.turn_off
          continue_on_error: true
          target:
            entity_id: switch.desk_child_lock
        - wait_template: "{{ is_state('switch.desk_child_lock', 'off') }}"
          timeout: "00:00:15"
    - action: scene.turn_on
      target:
        entity_id: "{{ scene }}"
    - if: "{{ not is_state('switch.desk_child_lock', 'off') }}"
      then:
        - delay: "00:00:20"
        - action: scene.turn_on
          target:
            entity_id: "{{ scene }}"

desk_up:
  alias: "Desk: up"
  icon: mdi:arrow-up-bold
  sequence:
    - action: script.desk_move
      data:
        direction: up

desk_down:
  alias: "Desk: down"
  icon: mdi:arrow-down-bold
  sequence:
    - action: script.desk_move
      data:
        direction: down

# Day off stops the desk schedule; turning it off starts the schedule again
day_off_on:
  alias: "Day off: on"
  icon: mdi:beach
  sequence:
    - action: automation.turn_off
      target:
        entity_id: automation.desk_schedule

day_off_off:
  alias: "Day off: off"
  icon: mdi:briefcase
  sequence:
    - action: automation.turn_on
      target:
        entity_id: automation.desk_schedule
