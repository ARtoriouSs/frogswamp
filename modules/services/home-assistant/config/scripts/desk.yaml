# The desk panel locks itself after about a minute of idle time and ignores commands while locked.
# The lock is the child lock switch, so turn it off first, then move. The panel locks itself again
desk_move:
  alias: "Desk: move"
  mode: single
  fields:
    direction:
      description: up or down
      required: true
      selector:
        select:
          options:
            - up
            - down
  sequence:
    - if: "{{ not is_state('switch.desk_child_lock', 'off') }}"
      then:
        - action: switch.turn_off
          continue_on_error: true
          target:
            entity_id: switch.desk_child_lock
        - wait_template: "{{ is_state('switch.desk_child_lock', 'off') }}"
          timeout: "00:00:15"
    - action: scene.turn_on
      target:
        entity_id: "scene.office_desk_{{ direction }}"

desk_up:
  alias: "Desk: up"
  icon: mdi:arrow-up-bold
  sequence:
    - action: script.desk_move
      data:
        direction: up

desk_down:
  alias: "Desk: down"
  icon: mdi:arrow-down-bold
  sequence:
    - action: script.desk_move
      data:
        direction: down
