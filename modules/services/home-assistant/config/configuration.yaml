# Repo-owned. UI-made automations/scripts/scenes live in the state dir (the "ui" includes)
default_config:

homeassistant:
  latitude: !secret latitude
  longitude: !secret longitude
  packages: !include_dir_named packages

automation manual: !include_dir_merge_list automations
automation ui: !include automations.yaml

script manual: !include_dir_merge_named scripts
script ui: !include scripts.yaml

scene manual: !include_dir_merge_list scenes
scene ui: !include scenes.yaml

# A month of history for the Uptime tab's Month range (the default is 10 days)
recorder:
  purge_keep_days: 31

lovelace:
  mode: storage
  dashboards:
    main-yaml:
      mode: yaml
      filename: dashboards/main.yaml
      title: Main
      icon: mdi:frog
      show_in_sidebar: true
