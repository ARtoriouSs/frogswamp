# Both bathroom floors, through the Tuya scenes. Timings come from packages/schedule.yaml:
# mornings from 1 h before wakeup to 1 h after it, nights from 1 h before bedtime to bedtime.
# Vacation and Tuya rule mode stop it. One automation per bathroom (each has its own area),
# the second one reuses the first one's schedule
- id: repo_floor_warming_guest
  alias: "Floor warming: guest"
  description: Guest bathroom floor
  mode: queued
  triggers: &floor_warming_triggers
    - trigger: time
      id: on_morning_weekday
      at:
        entity_id: input_datetime.wakeup_weekday
        offset: "-01:00:00"
    - trigger: time
      id: off_morning_weekday
      at:
        entity_id: input_datetime.wakeup_weekday
        offset: "01:00:00"
    - trigger: time
      id: on_morning_weekend
      at:
        entity_id: input_datetime.wakeup_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_morning_weekend
      at:
        entity_id: input_datetime.wakeup_weekend
        offset: "01:00:00"
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: off_night_workday
      at: input_datetime.bedtime_workday
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_night_weekend
      at: input_datetime.bedtime_weekend
  variables: &floor_warming_variables
    # ISO weekdays (1 is Monday) of each period. A night counts on the day it started
    days:
      morning_weekday: [1, 2, 3, 4, 5]
      morning_weekend: [6, 7]
      night_workday: [7, 1, 2, 3, 4]
      night_weekend: [5, 6]
  conditions: &floor_warming_conditions
    - condition: state
      entity_id:
        - input_boolean.vacation
        - input_boolean.tuya_mode
      state: "off"
    # A night can go past midnight, so its day is taken 12 h back (any time from noon to the next noon)
    - condition: template
      value_template: >-
        {% set period = trigger.id.split('_', 1)[1] %}
        {% set moment = now() - timedelta(hours=12) if period.startswith('night') else now() %}
        {{ moment.isoweekday() in days[period] }}
  actions:
    - action: scene.turn_on
      target:
        entity_id: "scene.guest_bathroom_floor_warming_guest_{{ 'on' if trigger.id.startswith('on') else 'off' }}"

- id: repo_floor_warming_master
  alias: "Floor warming: master"
  description: Master bathroom floor
  mode: queued
  triggers: *floor_warming_triggers
  variables: *floor_warming_variables
  conditions: *floor_warming_conditions
  actions:
    - action: scene.turn_on
      target:
        entity_id: "scene.master_bathroom_floor_warming_master_{{ 'on' if trigger.id.startswith('on') else 'off' }}"
