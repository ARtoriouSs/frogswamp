# Both bathroom floors, through the Tuya scenes. Weekdays on 08:00–11:00 and 22:00–00:00,
# weekends on 09:00–12:00 and 23:00–01:00. A night ends on the next day, so its "off" is
# checked against the day the night started (Friday night ends at 00:00, Sunday night at 01:00).
# Vacation and Tuya rule mode stop it
- id: repo_floor_warming_schedule
  alias: "Floor warming: schedule"
  mode: queued
  triggers:
    - trigger: time
      id: on_weekday
      at:
        - "08:00:00"
        - "22:00:00"
    - trigger: time
      id: off_weekday
      at: "11:00:00"
    - trigger: time
      id: off_weekday_night
      at: "00:00:00"
    - trigger: time
      id: on_weekend
      at:
        - "09:00:00"
        - "23:00:00"
    - trigger: time
      id: off_weekend
      at: "12:00:00"
    - trigger: time
      id: off_weekend_night
      at: "01:00:00"
  conditions:
    - condition: state
      entity_id:
        - input_boolean.vacation
        - input_boolean.tuya_mode
      state: "off"
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id:
                - on_weekday
                - off_weekday
            - condition: time
              weekday: [mon, tue, wed, thu, fri]
        # midnight after Monday–Friday
        - condition: and
          conditions:
            - condition: trigger
              id: off_weekday_night
            - condition: time
              weekday: [tue, wed, thu, fri, sat]
        - condition: and
          conditions:
            - condition: trigger
              id:
                - on_weekend
                - off_weekend
            - condition: time
              weekday: [sat, sun]
        # 01:00 after Saturday and Sunday
        - condition: and
          conditions:
            - condition: trigger
              id: off_weekend_night
            - condition: time
              weekday: [sun, mon]
  actions:
    - action: scene.turn_on
      target:
        entity_id: >-
          {% if trigger.id.startswith('on') %}
            {{ ['scene.master_bathroom_floor_warming_master_on', 'scene.guest_bathroom_floor_warming_guest_on'] }}
          {% else %}
            {{ ['scene.master_bathroom_floor_warming_master_off', 'scene.guest_bathroom_floor_warming_guest_off'] }}
          {% endif %}
