# Both bathroom floors, through script.floor_warming_set (Tuya Local). Timings come from packages/schedule.yaml:
# mornings from 1 h before wakeup to 1 h after it, nights from 1 h before bedtime to bedtime.
# Workday or weekend timings are picked by the Workday integration, so holidays get the weekend ones.
# Vacation and Tuya rule mode stop it. One automation per bathroom (each has its own area),
# the second one reuses the first one's schedule
- id: repo_floor_warming_guest_schedule
  alias: "Floor warming: guest schedule"
  description: Guest bathroom floor
  mode: queued
  triggers: &floor_warming_triggers
    - trigger: time
      id: on_morning_workday
      at:
        entity_id: input_datetime.wakeup_workday
        offset: "-01:00:00"
    - trigger: time
      id: off_morning_workday
      at:
        entity_id: input_datetime.wakeup_workday
        offset: "01:00:00"
    - trigger: time
      id: on_morning_weekend
      at:
        entity_id: input_datetime.wakeup_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_morning_weekend
      at:
        entity_id: input_datetime.wakeup_weekend
        offset: "01:00:00"
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: off_night_workday
      at: input_datetime.bedtime_workday
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_night_weekend
      at: input_datetime.bedtime_weekend
  variables:
    bathroom: guest
  conditions: &floor_warming_conditions
    - condition: state
      entity_id:
        - input_boolean.vacation
        - input_boolean.tuya_mode
      state: "off"
  actions: &floor_warming_actions
    # A morning goes by its own day, a night by the day after the one it started on
    # (12 h back from any time between noon and the next noon is that start day)
    - action: workday.check_date
      target:
        entity_id: binary_sensor.workday_sensor_pl
      data:
        check_date: >-
          {% if 'night' in trigger.id %}{{ (now() - timedelta(hours=12)).date() + timedelta(days=1) }}
          {%- else %}{{ now().date() }}{% endif %}
      response_variable: workday
    # Workday timings run only for a workday, weekend ones only for a weekend day or a holiday.
    # Day off on counts as a weekend day: late wakeup and late bedtime
    - condition: template
      value_template: >-
        {{ (workday['binary_sensor.workday_sensor_pl'].workday and is_state('input_boolean.day_off', 'off'))
           == trigger.id.endswith('workday') }}
    # Timed runs read this to know if the schedule wants the heater on (packages/timed_heat.yaml)
    - action: "input_boolean.turn_{{ 'on' if trigger.id.startswith('on') else 'off' }}"
      target:
        entity_id: "input_boolean.heat_schedule_floor_{{ bathroom }}"
    - action: script.floor_warming_set
      data:
        bathroom: "{{ bathroom }}"
        state: "{{ 'on' if trigger.id.startswith('on') else 'off' }}"

- id: repo_floor_warming_master_schedule
  alias: "Floor warming: master schedule"
  description: Master bathroom floor
  mode: queued
  triggers: *floor_warming_triggers
  variables:
    bathroom: master
  conditions: *floor_warming_conditions
  actions: *floor_warming_actions
