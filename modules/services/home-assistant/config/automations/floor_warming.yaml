# Both bathroom floors, through script.floor_warming_set (Tuya Local). Timings come from packages/schedule.yaml:
# from 1 h before wakeup and from 1 h before bedtime, 3 h each. The schedule only asks for a lease (script.heat_lease)
# and never turns the floor off, the end of the lease does.
# sensor.wakeup already knows its day. Night timings are picked by the Workday integration, so holidays get the weekend ones.
# Vacation stops it. One automation per bathroom (each has its own area),
# the second one reuses the first one's schedule
- id: repo_floor_warming_guest_schedule
  alias: "Floor warming: guest schedule"
  description: Guest bathroom floor
  mode: queued
  triggers: &floor_warming_triggers
    - trigger: time
      id: on_morning
      at:
        entity_id: sensor.wakeup
        offset: "-01:00:00"
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
  variables:
    bathroom: guest
  conditions: &floor_warming_conditions
    - condition: state
      entity_id: input_boolean.vacation
      state: "off"
  actions: &floor_warming_actions
    # A night goes by the day after the one it started on
    # (12 h back from any time between noon and the next noon is that start day)
    - if: "{{ 'night' in trigger.id }}"
      then:
        - action: workday.check_date
          target:
            entity_id: binary_sensor.workday_sensor_pl
          data:
            check_date: "{{ (now() - timedelta(hours=12)).date() + timedelta(days=1) }}"
          response_variable: workday
        # Workday timings run only before a workday, weekend ones only before a weekend day or a holiday.
        # Day off on counts as a weekend day: late bedtime
        - condition: template
          value_template: >-
            {{ (workday['binary_sensor.workday_sensor_pl'].workday and is_state('input_boolean.day_off', 'off'))
               == trigger.id.endswith('workday') }}
    - action: script.heat_lease
      data:
        device: "floor_{{ bathroom }}"

- id: repo_floor_warming_master_schedule
  alias: "Floor warming: master schedule"
  description: Master bathroom floor
  mode: queued
  triggers: *floor_warming_triggers
  variables:
    bathroom: master
  conditions: *floor_warming_conditions
  actions: *floor_warming_actions
