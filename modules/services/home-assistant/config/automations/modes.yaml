# Turning a mode on also runs its Tuya "on" scene, which turns off the Tuya app's own automations.
# Turning it off runs nothing in Tuya, so the Tuya automations stay off while HA is in charge
- id: repo_modes_tuya_scene
  alias: "Modes: Tuya scene on mode on"
  mode: queued
  triggers:
    - trigger: state
      entity_id: input_boolean.day_off
      to: "on"
      id: scene.office_days_off_on
    - trigger: state
      entity_id: input_boolean.vacation
      to: "on"
      id: scene.general_actions_vacation_on
    - trigger: state
      entity_id: input_boolean.guests_in_living_room
      to: "on"
      id: scene.living_room_guests_in_the_living_room_on
  actions:
    - action: scene.turn_on
      target:
        entity_id: "{{ trigger.id }}"

# Vacation on also turns the devices off. The master towel heat relay is turned off in towel_heat.yaml.
# Nothing here turns them on again: the floors come back with their schedules. The cube stays on
- id: repo_modes_vacation_off
  alias: "Modes: devices off on Vacation on"
  mode: queued
  triggers:
    - trigger: state
      entity_id: input_boolean.vacation
      from: "off"
      to: "on"
  actions:
    - action: climate.turn_off
      target:
        entity_id: climate.guest_bathroom_towel_heat_guest
    - action: scene.turn_on
      target:
        entity_id:
          - scene.guest_bathroom_floor_warming_guest_off
          - scene.master_bathroom_floor_warming_master_off
