# Yeelight Cube Matrix in the office. It stays on all the time (the lamp turns itself back on
# when it is turned off, so there is no off schedule) and shows a random animated frog, plus
# short animations when the desk, blinds or modes change. The short ones play even when the
# cube is off (wake) and then go back to what was there before.
# Quiet mode, from bedtime to wakeup, during Vacation and while nobody is home: only a green dot at 0%.
# Frogs, coffee/moon and problem signs stop, event animations still play at 100%

# Bedtime and wakeup turn Cube night on and off with the same workday logic as the floor warming
# (packages/schedule.yaml). The background tells if the cube is dimmed now: the dot means it is.
# A wakeup missed while HA was down is not caught up, the cube stays dimmed until the next one or until
# Cube night is turned off by hand
- id: repo_cube_quiet
  alias: "Cube: green dot at night and on Vacation"
  mode: queued
  triggers:
    - trigger: time
      id: night_start_workday
      at: input_datetime.bedtime_workday
    - trigger: time
      id: night_start_weekend
      at: input_datetime.bedtime_weekend
    - trigger: time
      id: night_end
      at: sensor.wakeup
    # Cube night also by hand, e.g. after a missed wakeup
    - trigger: state
      id: mode
      entity_id:
        - binary_sensor.vacation_active
        - input_boolean.cube_night
        - input_boolean.nobody_home
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
    # Puts the brightness down again if HA restarted in the middle of an event animation
    - trigger: homeassistant
      id: start
      event: start
  actions:
    - if: "{{ trigger.id.startswith('night_start') }}"
      then:
        # A night start goes by the next day
        # (12 h back from any time between noon and the next noon is the day the night started)
        - action: workday.check_date
          target:
            entity_id: binary_sensor.workday_sensor_pl
          data:
            check_date: "{{ (now() - timedelta(hours=12)).date() + timedelta(days=1) }}"
          response_variable: workday
        # Day off on counts as a weekend day
        - if:
            - condition: template
              value_template: >-
                {{ (workday['binary_sensor.workday_sensor_pl'].workday and is_state('binary_sensor.day_off_next_day', 'off'))
                   != trigger.id.endswith('workday') }}
          then:
            - stop: Not this day's timing
    - if: "{{ trigger.id.startswith('night') }}"
      then:
        - action: "input_boolean.turn_{{ 'on' if trigger.id.startswith('night_start') else 'off' }}"
          target:
            entity_id: input_boolean.cube_night
    - variables:
        quiet: "{{ is_state('binary_sensor.vacation_active', 'on') or is_state('input_boolean.cube_night', 'on') or is_state('input_boolean.nobody_home', 'on') }}"
        dimmed: "{{ is_state('select.cube_matrix_192_168_101_121_background', 'dot') }}"
    - choose:
        - conditions: "{{ quiet and not dimmed }}"
          sequence:
            - action: script.cube_sleep
        - conditions: "{{ quiet }}"
          sequence:
            - action: script.cube_brightness_off
        - conditions: "{{ dimmed }}"
          sequence:
            - action: script.cube_wake

# Another frog every hour while the cube is on, never the same one twice in a row
- id: repo_cube_next_frog
  alias: "Cube: another frog every hour"
  triggers:
    - trigger: time_pattern
      minutes: 0
  conditions:
    - condition: state
      entity_id: light.cube_matrix_192_168_101_121
      state: "on"
    - &not_quiet
      condition: state
      entity_id:
        - binary_sensor.vacation_active
        - input_boolean.cube_night
        - input_boolean.nobody_home
      state: "off"
  variables:
    frogs: &frogs
      - frog_jump
      - frog_sway
      - frog_blink
      - frog_croak
  actions:
    - action: cubematrix.set_background
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        preset: >-
          {{ frogs | reject('eq', states('select.cube_matrix_192_168_101_121_background'))
             | list | random }}

# A short tap on the lamp's button: the next frog, always in the same order
- id: repo_cube_tap_next_frog
  alias: "Cube: next frog on button tap"
  mode: queued
  triggers:
    - trigger: state
      entity_id: event.office_cube_matrix_192_168_101_121_button
      not_from: unavailable
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'tap' }}"
    - *not_quiet
  variables:
    frogs: *frogs
    current: "{{ states('select.cube_matrix_192_168_101_121_background') }}"
  actions:
    - action: cubematrix.set_background
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        # Not a frog yet: start with the first one
        preset: >-
          {% set i = frogs.index(current) if current in frogs else -1 %}
          {{ frogs[(i + 1) % frogs | length] }}

# The desk: a scene's state is the time it was last run from HA, so a new value means it just ran.
# The modes: only the switches, so a calendar event doesn't flash the cube at midnight.
# The blinds and curtains: their button scripts. Moves from the Tuya app or by hand are not seen here
- id: repo_cube_event_animations
  alias: "Cube: animations for desk, blinds and modes"
  mode: restart
  triggers:
    - trigger: state
      entity_id: scene.office_desk_up
      id: arrow_up
    - trigger: state
      entity_id: scene.office_desk_down
      id: arrow_down
    # The blinds and curtains button scripts, when they start
    - trigger: state
      entity_id:
        - script.blinds_open
        - script.blinds_full_close_open
        - script.blinds_open_door
        - script.curtains_open
      to: "on"
      id: blinds_open
    - trigger: state
      entity_id:
        - script.blinds_full_close
        - script.blinds_close_door
        - script.curtains_close
      to: "on"
      id: blinds_close
    - trigger: state
      entity_id:
        - input_boolean.day_off
        - input_boolean.vacation
        - input_boolean.guests_in_living_room
      from:
        - "on"
        - "off"
      to:
        - "on"
        - "off"
      id: mode
  conditions:
    # Not when an entity only comes back after a restart
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown']
           and trigger.to_state.state not in ['unavailable', 'unknown'] }}
  actions:
    - action: script.cube_event
      data:
        # A mode turned on shows the green check, turned off the red one
        preset: >-
          {% if trigger.id == 'mode' %}{{ 'check' if trigger.to_state.state == 'on' else 'check_red' }}{% else %}{{ trigger.id }}{% endif %}
        # The checks are still pictures, the rest are animations looped for the time
        repeat: forever
        duration: "{{ 10 if trigger.id == 'mode' else 5 }}"

# Coffee at work start, moon at work end, on workdays that aren't a day off or vacation
- id: repo_cube_work_start_end
  alias: "Cube: coffee at work start, moon at work end"
  triggers:
    - trigger: time
      at: input_datetime.work_start
      id: coffee
    - trigger: time
      at: input_datetime.work_end
      id: moon
  conditions:
    - condition: state
      entity_id: binary_sensor.workday_sensor_pl
      state: "on"
    - condition: state
      entity_id:
        - binary_sensor.day_off_active
        - binary_sensor.vacation_active
        - input_boolean.cube_night
        - input_boolean.nobody_home
      state: "off"
  actions:
    - action: cubematrix.show
      target:
        entity_id: light.cube_matrix_192_168_101_121
      data:
        preset: "{{ trigger.id }}"
        repeat: forever
        duration: 10
        wake: true

# Something starts playing through the TV's Chromecast: Jellyfin cast from the phone, or a match
# from the football page. Kodi isn't in HA, so a match played in Kodi isn't seen
- id: repo_cube_tv_play
  alias: "Cube: play sign when the TV starts casting"
  mode: restart
  triggers:
    - trigger: state
      entity_id: media_player.philips_tv_google_cast
      to: playing
      not_from:
        - unavailable
        - unknown
  actions:
    - action: script.cube_event
      data:
        preset: play
        duration: 5

# The same problems as in alerts.yaml, shown when they start and again every hour (at :30, between
# the frog changes) while they last. A failed integration is amber, a server problem pulses red
- id: repo_cube_problems
  alias: "Cube: integration and server problems"
  mode: queued
  variables:
    integration_down: "{{ states('sensor.failed_integrations') | int(0) > 0 }}"
    server_problem: &server_problem >-
      {% set ns = namespace(old=false) %}
      {% for repo in ['local', 'b2'] %}
        {% set s = states('sensor.backup_last_' ~ repo) %}
        {% set t = as_timestamp(s, none) %}
        {% if s in ['none', 'unreachable'] or (t is not none and now().timestamp() - t > 48 * 3600) %}
          {% set ns.old = true %}
        {% endif %}
      {% endfor %}
      {% set disk = states.sensor.backup_disk %}
      {% set zigbee = states.binary_sensor.zigbee2mqtt_bridge_connection_state %}
      {{ ns.old
         or (disk is not none and disk.state == 'missing' and now() - disk.last_changed > timedelta(minutes=30))
         or (zigbee is not none and zigbee.state != 'on' and now() - zigbee.last_changed > timedelta(minutes=10)) }}
  triggers:
    - trigger: state
      entity_id: sensor.failed_integrations
      for: "00:10:00"
    - trigger: template
      value_template: *server_problem
    - trigger: time_pattern
      minutes: 30
  conditions:
    - "{{ integration_down or server_problem }}"
    - *not_quiet
  actions:
    - if: "{{ integration_down }}"
      then:
        - action: cubematrix.show
          target:
            entity_id: light.cube_matrix_192_168_101_121
          data:
            preset: integration_down
            repeat: forever
            duration: 10
            wait: true
            wake: true
    - if: "{{ server_problem }}"
      then:
        - action: cubematrix.show
          target:
            entity_id: light.cube_matrix_192_168_101_121
          data:
            preset: server_problem
            repeat: forever
            duration: 10
            wait: true
            wake: true
