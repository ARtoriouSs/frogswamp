# Master bathroom towel heat, through its Zigbee relay (the heater itself stays on, the relay gives it power).
# Nights only: from 1 h before bedtime, like the floor warming, for 3 h (packages/schedule.yaml). The schedule
# only asks for a lease (script.heat_lease) and never turns the heater off, the end of the lease does.
# Workday or weekend bedtime is picked by the Workday integration for the next day.
# Vacation on turns it off. Vacation off doesn't turn it on, the next night does.
# The guest towel heat has the same schedule, but only while the guests mode in the living room is on
- id: repo_towel_heat_master_schedule
  alias: "Towel heat: master schedule"
  description: Master bathroom towel heat relay, 3 h from 1 h before bedtime, off during Vacation
  mode: queued
  variables:
    device: towel_master
    heater: switch.master_bathroom_towel_heat_relay
  triggers: &towel_heat_triggers
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
    - trigger: state
      id: off_vacation_start
      entity_id: input_boolean.vacation
      from: "off"
      to: "on"
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id: off_vacation_start
        - condition: state
          entity_id: input_boolean.vacation
          state: "off"
  actions: &towel_heat_actions
    # Only for the night triggers, so Vacation works even without the Workday integration
    - if:
        - condition: template
          value_template: "{{ 'night' in trigger.id }}"
      then:
        # A night goes by the day after the one it started on
        # (12 h back from any time between noon and the next noon is that start day)
        - action: workday.check_date
          target:
            entity_id: binary_sensor.workday_sensor_pl
          data:
            check_date: "{{ (now() - timedelta(hours=12)).date() + timedelta(days=1) }}"
          response_variable: workday
        # Workday bedtime runs only before a workday, weekend one only before a weekend day or a holiday.
        # Day off on counts as a weekend day: late bedtime
        - if:
            - condition: template
              value_template: >-
                {{ (workday['binary_sensor.workday_sensor_pl'].workday and is_state('binary_sensor.day_off_next_day', 'off'))
                   != trigger.id.endswith('workday') }}
          then:
            - stop: Not this night's bedtime
    - if: "{{ trigger.id == 'off_vacation_start' }}"
      then:
        - action: homeassistant.turn_off
          target:
            entity_id: "{{ heater }}"
      else:
        - action: script.heat_lease
          data:
            device: "{{ device }}"

- id: repo_towel_heat_guest_schedule
  alias: "Towel heat: guest schedule"
  description: Guest bathroom towel heat, like the master one, only while guests are in the living room
  mode: queued
  variables:
    device: towel_guest
    heater: climate.guest_bathroom_towel_heat_guest
  triggers: *towel_heat_triggers
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id: off_vacation_start
        - condition: and
          conditions:
            - condition: state
              entity_id: input_boolean.vacation
              state: "off"
            - condition: state
              entity_id: input_boolean.guests_in_living_room
              state: "on"
  actions: *towel_heat_actions

# Guest towel heat gets its full target on every turn on, from any place: card, voice, button, app or the device.
# A target changed later in the same run stays until the next turn on
- id: repo_towel_heat_guest_target
  alias: "Towel heat: guest target on turn on"
  description: Sets the guest towel heat target to 35 °C each time it turns on
  triggers:
    - trigger: state
      entity_id: climate.guest_bathroom_towel_heat_guest
      from: "off"
      to: "heat"
  actions:
    - action: climate.set_temperature
      target:
        entity_id: climate.guest_bathroom_towel_heat_guest
      data:
        temperature: 35
