# Master bathroom towel heat, through its Zigbee relay (the heater itself stays on, the relay gives it power).
# Nights only: from 1 h before bedtime, like the floor warming, to 1 h after bedtime (packages/schedule.yaml).
# Workday or weekend bedtime is picked by the Workday integration for the next day.
# Vacation on turns it off. Vacation off doesn't turn it on, the next night does. Tuya rule mode doesn't stop it,
# the relay isn't a Tuya device
- id: repo_towel_heat_master
  alias: "Towel heat: master"
  description: Master bathroom towel heat relay, bedtime ± 1 h, off during Vacation
  mode: queued
  triggers:
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: off_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "01:00:00"
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "01:00:00"
    - trigger: state
      id: off_vacation_start
      entity_id: input_boolean.vacation
      from: "off"
      to: "on"
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id: off_vacation_start
        - condition: state
          entity_id: input_boolean.vacation
          state: "off"
  actions:
    # Only for the night triggers, so Vacation works even without the Workday integration
    - if:
        - condition: template
          value_template: "{{ 'night' in trigger.id }}"
      then:
        # A night goes by the day after the one it started on
        # (12 h back from any time between noon and the next noon is that start day)
        - action: workday.check_date
          target:
            entity_id: binary_sensor.workday_sensor_pl
          data:
            check_date: "{{ (now() - timedelta(hours=12)).date() + timedelta(days=1) }}"
          response_variable: workday
        # Workday bedtime runs only before a workday, weekend one only before a weekend day or a holiday.
        # Day off on counts as a weekend day: late bedtime
        - if:
            - condition: template
              value_template: >-
                {{ (workday['binary_sensor.workday_sensor_pl'].workday and is_state('input_boolean.day_off', 'off'))
                   != trigger.id.endswith('workday') }}
          then:
            - stop: Not this night's bedtime
    - action: "switch.turn_{{ 'on' if trigger.id.startswith('on') else 'off' }}"
      target:
        entity_id: switch.master_bathroom_towel_heat_relay
