# Master bathroom towel heat, through its Zigbee relay (the heater itself stays on, the relay gives it power).
# Nights only: from 1 h before bedtime, like the floor warming, to 1 h after bedtime (packages/schedule.yaml).
# Vacation on turns it off, Vacation off turns it on. Tuya rule mode doesn't stop it, the relay isn't a Tuya device
- id: repo_towel_heat_master
  alias: "Towel heat: master"
  description: Master bathroom towel heat relay, bedtime ± 1 h, off during Vacation
  mode: queued
  triggers:
    - trigger: time
      id: on_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "-01:00:00"
    - trigger: time
      id: off_night_workday
      at:
        entity_id: input_datetime.bedtime_workday
        offset: "01:00:00"
    - trigger: time
      id: on_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "-01:00:00"
    - trigger: time
      id: off_night_weekend
      at:
        entity_id: input_datetime.bedtime_weekend
        offset: "01:00:00"
    - trigger: state
      id: off_vacation_start
      entity_id: input_boolean.vacation
      from: "off"
      to: "on"
    - trigger: state
      id: on_vacation_end
      entity_id: input_boolean.vacation
      from: "on"
      to: "off"
  variables:
    # ISO weekdays (1 is Monday) of each night, counted on the day it started
    days:
      night_workday: [7, 1, 2, 3, 4]
      night_weekend: [5, 6]
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id:
            - off_vacation_start
            - on_vacation_end
        - condition: and
          conditions:
            - condition: state
              entity_id: input_boolean.vacation
              state: "off"
            # A night goes past midnight, so its day is taken 12 h back (any time from noon to the next noon)
            - condition: template
              value_template: >-
                {{ (now() - timedelta(hours=12)).isoweekday() in days[trigger.id.split('_', 1)[1]] }}
  actions:
    - action: "switch.turn_{{ 'on' if trigger.id.startswith('on') else 'off' }}"
      target:
        entity_id: switch.master_bathroom_towel_heat_relay
