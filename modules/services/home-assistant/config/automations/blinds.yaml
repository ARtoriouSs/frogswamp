# Curtains and blinds on a schedule, through the scripts in scripts/blinds.yaml (Tuya Local).
# Vacation stops all of them; Guests in the living room stops the morning opening
- id: repo_curtains_close_sunset
  alias: "Curtains: close at sunset"
  triggers:
    - trigger: sun
      event: sunset
  conditions:
    - condition: state
      entity_id: input_boolean.vacation
      state: "off"
  actions:
    - action: script.curtains_close

- id: repo_blinds_close_evening
  alias: "Blinds: full close 2 h after sunset"
  triggers:
    - trigger: sun
      event: sunset
      offset: "02:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.vacation
      state: "off"
  actions:
    - action: script.blinds_full_close

# Again at night, in case they were opened in the evening
- id: repo_blinds_close_night
  alias: "Blinds: full close at 01:00"
  triggers:
    - trigger: time
      at: "01:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.vacation
      state: "off"
  actions:
    - action: script.blinds_full_close

- id: repo_blinds_open_morning
  alias: "Blinds: open 2 h after sunrise"
  triggers:
    - trigger: sun
      event: sunrise
      offset: "02:00:00"
  conditions:
    - condition: state
      entity_id:
        - input_boolean.vacation
        - input_boolean.guests_in_living_room
      state: "off"
  actions:
    - action: script.blinds_full_close_open
