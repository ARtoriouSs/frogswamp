# Server and house alerts to the phone. Each one fires once per problem, not on every sensor update
- id: repo_alert_backup_old
  alias: "Alert: backup is old"
  description: Newest snapshot older than 48 h, or the repo has none or can't be reached
  triggers:
    - trigger: template
      id: local
      value_template: >-
        {% set s = states('sensor.backup_last_local') %}
        {% set t = as_timestamp(s, none) %}
        {{ s in ['none', 'unreachable'] or (t is not none and now().timestamp() - t > 48 * 3600) }}
    - trigger: template
      id: b2
      value_template: >-
        {% set s = states('sensor.backup_last_b2') %}
        {% set t = as_timestamp(s, none) %}
        {{ s in ['none', 'unreachable'] or (t is not none and now().timestamp() - t > 48 * 3600) }}
  actions:
    - variables:
        last: "{{ states('sensor.backup_last_' ~ trigger.id) }}"
        when: >-
          {% set t = as_timestamp(last, none) %}
          {{ t | timestamp_custom('%d.%m %H:%M') if t is not none else last }}
    - action: notify.mobile_app_pixel_7
      data:
        title: "Backup ({{ trigger.id }}) is old"
        message: "Last snapshot: {{ when }}. Check: just ssh systemctl status restic-backups-{{ trigger.id }}"
        data:
          tag: "backup-old-{{ trigger.id }}"

- id: repo_alert_backup_disk
  alias: "Alert: backup disk missing"
  description: The A400 isn't mounted for 30 minutes
  triggers:
    - trigger: state
      entity_id: sensor.backup_disk
      to: missing
      for: "00:30:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Backup disk missing
        message: The A400 isn't mounted. Re-plug its cable; it mounts by itself
        data:
          tag: backup-disk

- id: repo_alert_server_disk
  alias: "Alert: server disk almost full"
  description: The server's disk is above 85% for 10 minutes
  triggers:
    - trigger: numeric_state
      entity_id: sensor.system_monitor_disk_usage_config
      above: 85
      for: "00:10:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Server disk almost full
        message: "The disk is {{ states('sensor.system_monitor_disk_usage_config') }}% full. Check: just ssh df -h /"
        data:
          tag: server-disk

- id: repo_alert_server_temperature
  alias: "Alert: server CPU is hot"
  description: The server's CPU is above 85 °C for 10 minutes
  triggers:
    - trigger: numeric_state
      entity_id: sensor.system_monitor_processor_temperature
      above: 85
      for: "00:10:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Server CPU is hot
        message: "The CPU is at {{ states('sensor.system_monitor_processor_temperature') }} °C. Check the airflow around the NUC"
        data:
          tag: server-temperature

- id: repo_alert_battery_temperature
  alias: "Alert: phone or watch battery is hot"
  description: The battery of the phone or the watch is above 42 °C for 5 minutes
  mode: parallel
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.pixel_7_battery_temperature
        - sensor.google_pixel_watch_battery_temperature
      above: 42
      for: "00:05:00"
  actions:
    - variables:
        device: "{{ 'Phone' if 'pixel_7' in trigger.entity_id else 'Watch' }}"
    - action: notify.mobile_app_pixel_7
      data:
        title: "{{ device }} battery is hot"
        message: "The battery is at {{ trigger.to_state.state }} °C. Stop charging or heavy use and let it cool down"
        data:
          tag: "battery-hot-{{ device | lower }}"

# Heat at a high charge wears the battery the most. Fires once when all three are true for 5 minutes
- id: repo_alert_phone_warm_full_charge
  alias: "Alert: phone charges to full while warm"
  description: The phone is charging above 80% with the battery at 38 °C or more for 5 minutes
  triggers:
    - trigger: template
      value_template: >-
        {{ is_state('binary_sensor.pixel_7_is_charging', 'on')
           and states('sensor.pixel_7_battery_level') | float(0) >= 80
           and states('sensor.pixel_7_battery_temperature') | float(0) >= 38 }}
      for: "00:05:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Phone charges to full while warm
        message: >-
          The battery is at {{ states('sensor.pixel_7_battery_level') }}% and
          {{ states('sensor.pixel_7_battery_temperature') }} °C. Heat at a high charge wears it the most:
          unplug it or let it cool down
        data:
          tag: battery-warm-charge

# The state trigger fires once when the 1 h is reached, not again while the device stays offline.
# Add new devices here (one entity per device is enough)
- id: repo_alert_device_offline
  alias: "Alert: device offline"
  description: A device is unavailable for 1 hour
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - cover.blinds_left_door_local
        - cover.blinds_middle_local
        - cover.blinds_right_local
        - cover.curtains_local
        - climate.thermostat_guest_local
        - climate.thermostat_master_local
        - climate.guest_bathroom_towel_heat_guest
        - switch.master_bathroom_towel_heat_relay
        - switch.desk_child_lock
        - binary_sensor.leak_sensor_kitchen_water_leak
        - binary_sensor.leak_sensor_master_bathroom_water_leak
        - binary_sensor.workday_sensor_pl
      to: unavailable
      for: "01:00:00"
  conditions:
    # when the whole integration is down, "integration down" says it once instead of one message per device
    - "{{ config_entry_attr(config_entry_id(trigger.entity_id), 'state') | string == 'loaded' }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: "Offline: {{ trigger.to_state.name }}"
        message: "{{ trigger.entity_id }} is unavailable since {{ as_local(trigger.to_state.last_changed).strftime('%d.%m %H:%M') }}"
        data:
          tag: "offline-{{ trigger.entity_id }}"

# A failed integration (e.g. Tuya when its cloud timed out at startup) isn't retried by HA,
# so reload it once by itself, then tell whether that helped
- id: repo_alert_integration_down
  alias: "Alert: integration down"
  description: An integration failed for 10 minutes; reloaded once, then reported
  triggers:
    - trigger: state
      entity_id: sensor.failed_integrations
      for: "00:10:00"
  conditions:
    - "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) if trigger.from_state else trigger.to_state.state | int(0) > 0 }}"
  actions:
    - variables:
        failed: "{{ state_attr('sensor.failed_integrations', 'entries') or [] }}"
    - repeat:
        for_each: "{{ failed | map(attribute='id') | list }}"
        sequence:
          - action: homeassistant.reload_config_entry
            continue_on_error: true
            data:
              entry_id: "{{ repeat.item }}"
    - delay: "00:03:00"
    - variables:
        still: "{{ (state_attr('sensor.failed_integrations', 'entries') or []) | map(attribute='domain') | list }}"
        fixed: "{{ failed | map(attribute='domain') | reject('in', still) | list }}"
    - if: "{{ still | count > 0 }}"
      then:
        - action: notify.mobile_app_pixel_7
          data:
            title: "Integration down: {{ still | join(', ') }}"
            message: "Reloading didn't help. Settings → Devices & services → {{ still | join(', ') }} → ⋮ → Reload"
            data:
              tag: integration-down
    - if: "{{ fixed | count > 0 }}"
      then:
        - action: notify.mobile_app_pixel_7
          data:
            title: "Integration recovered: {{ fixed | join(', ') }}"
            message: "It failed for 10 min and was reloaded automatically"
            data:
              tag: integration-down

# The desk stops following new meetings without this, for example after the secret link was reset
- id: repo_alert_work_calendar
  alias: "Alert: work calendar is old"
  description: The work-calendar service hasn't read the calendar for 2 hours. It isn't read during a day off
  triggers:
    - trigger: template
      value_template: >-
        {% set t = as_timestamp(states('sensor.work_calendar_last_read'), none) %}
        {{ is_state('input_boolean.day_off', 'off') and (t is none or now().timestamp() - t > 2 * 3600) }}
      for: "00:30:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Work calendar is old
        message: "New meetings don't reach the desk. Check: just ssh journalctl -u work-calendar"
        data:
          tag: work-calendar

- id: repo_alert_zigbee_bridge
  alias: "Alert: Zigbee bridge down"
  description: Zigbee2MQTT is disconnected for 10 minutes
  triggers:
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
      to:
        - "off"
        - unavailable
      for: "00:10:00"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Zigbee bridge down
        message: "Zigbee devices don't respond. Check the dongle, then: just ssh systemctl restart zigbee2mqtt"
        data:
          tag: zigbee-bridge

# Fires when the internet is back, so the message can get out. Drops under 1 minute are ignored
- id: repo_alert_internet_down
  alias: "Alert: internet was down"
  description: Router WAN was down; tells when and for how long
  triggers:
    - trigger: state
      entity_id: binary_sensor.huawei_igd_wan_status
      from: "off"
      to: "on"
  conditions:
    - "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 60 }}"
  actions:
    - variables:
        since: "{{ as_local(trigger.from_state.last_changed).strftime('%d.%m %H:%M') }}"
        until: "{{ as_local(trigger.to_state.last_changed).strftime('%H:%M') }}"
        minutes: "{{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int }}"
    - action: logbook.log
      data:
        name: Internet
        message: "was down {{ since }}–{{ until }} ({{ minutes }} min)"
        entity_id: binary_sensor.huawei_igd_wan_status
    - action: notify.mobile_app_pixel_7
      data:
        title: Internet was down
        message: "{{ since }}–{{ until }} ({{ minutes }} min)"

# Only a real drop below 15% counts: going offline and back, or an HA restart, doesn't fire it again
- id: repo_alert_printer_ink
  alias: "Alert: printer ink low"
  description: A cartridge drops below 15%
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - sensor.office_hp_tango_black_cartridge
        - sensor.office_printer_tri_color_cartridge
      not_from:
        - unavailable
        - unknown
  conditions:
    - "{{ trigger.from_state is not none and trigger.from_state.state | float(0) >= 15 and trigger.to_state.state | float(100) < 15 }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Printer ink low
        message: "{{ trigger.to_state.name }}: {{ trigger.to_state.state }}%"
        data:
          tag: "ink-{{ trigger.entity_id }}"

# Same as the ink alert: only a real drop below 5% counts
- id: repo_alert_fridge_filter
  alias: "Alert: time to change the fridge filter"
  description: The fridge filter capacity drops below 5%
  triggers:
    - trigger: state
      entity_id: sensor.fridge_filter_capacity
      not_from:
        - unavailable
        - unknown
  conditions:
    - "{{ trigger.from_state is not none and trigger.from_state.state | float(0) >= 5 and trigger.to_state.state | float(100) < 5 }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Time to change the fridge filter
        message: "Capacity: {{ trigger.to_state.state | float(0) | round(0) | int }}%. After changing it, tap the card on the Maintenance tab"
        data:
          tag: fridge-filter

# The car reports hours late, so the fuel can be lower by the time this arrives
- id: repo_alert_car_fuel
  alias: "Alert: car fuel low"
  description: The car fuel level drops below 10%
  triggers:
    - trigger: state
      entity_id: sensor.garage_audi_a5_sportback_fuel_level
      not_from:
        - unavailable
        - unknown
  conditions:
    - "{{ trigger.from_state is not none and trigger.from_state.state | float(0) >= 10 and trigger.to_state.state | float(100) < 10 }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: Car fuel is low
        message: "Fuel: {{ trigger.to_state.state }}% · {{ states('sensor.garage_audi_a5_sportback_range') }} km"
        data:
          tag: car-fuel

# Only a real drop below 2000 km counts. Entering a part's km for the first time doesn't alert, a later correction can
- id: repo_alert_car_part
  alias: "Alert: car part due"
  description: A car part has less than 2000 km left
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - sensor.car_oil
        - sensor.car_air_filter
        - sensor.car_cabin_filter
        - sensor.car_fuel_filter
        - sensor.car_gearbox_hydraulic
        - sensor.car_gearbox_mechanical
      attribute: km_left
  conditions:
    - "{{ trigger.from_state is not none and trigger.from_state.attributes.km_left is number and trigger.to_state.attributes.km_left is number }}"
    - "{{ trigger.from_state.attributes.km_left >= 2000 and trigger.to_state.attributes.km_left < 2000 }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: "{{ trigger.to_state.name }} is due soon"
        message: "{{ trigger.to_state.attributes.km_left }} km left"
        data:
          tag: "car-part-km-{{ trigger.entity_id }}"

# days_left changes at midnight, so this looks once a day. 29 is the first day under a month, so it fires once
- id: repo_alert_car_part_days
  alias: "Alert: car part due in a month"
  description: A car part or the inspection has less than a month left
  triggers:
    - trigger: time
      at: "10:00:00"
  variables:
    due: >-
      {{ ['sensor.car_oil', 'sensor.car_air_filter', 'sensor.car_cabin_filter', 'sensor.car_inspection']
         | select('is_state_attr', 'days_left', 29) | list }}
  conditions:
    - "{{ due | count > 0 }}"
  actions:
    - repeat:
        for_each: "{{ due }}"
        sequence:
          - action: notify.mobile_app_pixel_7
            data:
              title: "{{ state_attr(repeat.item, 'friendly_name') }} is due soon"
              message: "{{ state_attr(repeat.item, 'days_left') }} days left"
              data:
                tag: "car-part-days-{{ repeat.item }}"

# The km left comes from the car, not from a service date
- id: repo_alert_adblue
  alias: "Alert: AdBlue low"
  description: The car's AdBlue range drops below 2000 km
  triggers:
    - trigger: state
      entity_id: sensor.garage_audi_a5_sportback_adblue_range
      not_from:
        - unavailable
        - unknown
  conditions:
    - "{{ trigger.from_state is not none and trigger.from_state.state | float(0) >= 2000 and trigger.to_state.state | float(99999) < 2000 }}"
  actions:
    - action: notify.mobile_app_pixel_7
      data:
        title: AdBlue is low
        message: "{{ trigger.to_state.state }} km left"
        data:
          tag: adblue
