# Standing breaks: desk up for 30 minutes three times a day on workdays (Workday integration, no holidays). Day off, Vacation and Tuya rule mode stop it
- id: repo_desk_schedule
  alias: "Desk: schedule"
  description: Workdays, up at 13:00, 15:00 and 17:00, down 30 minutes later
  mode: queued
  triggers:
    - trigger: time
      id: up
      at:
        - "13:00:00"
        - "15:00:00"
        - "17:00:00"
    - trigger: time
      id: down
      at:
        - "13:30:00"
        - "15:30:00"
        - "17:30:00"
  conditions:
    - condition: state
      entity_id:
        - input_boolean.day_off
        - input_boolean.vacation
        - input_boolean.tuya_mode
      state: "off"
    # Workday integration: weekdays without holidays
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: "on"
  actions:
    - action: "script.desk_{{ trigger.id }}"
