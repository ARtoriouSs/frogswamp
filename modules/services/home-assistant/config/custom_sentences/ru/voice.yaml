# Voice phrases HA handles itself, before anything goes to Claude.
# The blinds and curtains run their Tuya scene for the whole action; one named device ("открой левые жалюзи")
# is left to HA's built-in phrases. Actions: packages/voice_intents.yaml
language: ru
intents:
  FrogBlindsOpen:
    data:
      - sentences:
          - "(открой|подними|сбрось) жалюзи [в гостиной]"
        slots:
          lang: ru
  FrogBlindsClose:
    data:
      - sentences:
          - "(закрой|опусти) жалюзи [в гостиной] [полностью]"
        slots:
          lang: ru
  FrogBalconyDoorOpen:
    data:
      - sentences:
          - "открой (дверь|проход|выход) на балкон"
        slots:
          lang: ru
  FrogBalconyDoorClose:
    data:
      - sentences:
          - "закрой (дверь|проход|выход) на балкон"
        slots:
          lang: ru
  FrogCurtainsOpen:
    data:
      - sentences:
          - "открой шторы [в спальне]"
        slots:
          lang: ru
  FrogCurtainsClose:
    data:
      - sentences:
          - "закрой шторы [в спальне]"
        slots:
          lang: ru
  FrogFloorHeatingOn:
    data:
      - sentences:
          - "включи (тёплый|теплый) пол в {bathroom}"
        slots:
          lang: ru
  FrogFloorHeatingOff:
    data:
      - sentences:
          - "выключи (тёплый|теплый) пол в {bathroom}"
        slots:
          lang: ru
  FrogTowelHeatOn:
    data:
      - sentences:
          - "включи полотенцесушитель в {bathroom}"
        slots:
          lang: ru
  FrogTowelHeatOff:
    data:
      - sentences:
          - "выключи полотенцесушитель в {bathroom}"
        slots:
          lang: ru
  FrogRoomTemperature:
    data:
      - sentences:
          - "(какая|сколько) [сейчас] температур(а|ы) в {room}"
          - "сколько [сейчас] градусов в {room}"
        slots:
          lang: ru
lists:
  bathroom:
    values:
      - in: "(гостевом санузле|гостевой ванной)"
        out: guest
      - in: "(мастер санузле|мастер ванной|большой ванной)"
        out: master
  room:
    values:
      - in: "спальне"
        out: bedroom
      - in: "(прихожей|коридоре)"
        out: hall
