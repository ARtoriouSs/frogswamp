# Set by automations/presence.yaml. The flag and the timer keep their state over HA restarts,
# a plain `for: 24:00:00` would start again after every deploy
input_boolean:
  nobody_home:
    name: Nobody home
    icon: mdi:home-export-outline
  # On the Schedule tab. Only for the rules that need both people's locations. The desk has its own, packages/desk.yaml
  location_paused:
    name: Nobody home automations paused
    icon: mdi:map-marker-off

timer:
  nobody_home:
    name: Nobody home for a day
    duration: "24:00:00"
    restore: true
