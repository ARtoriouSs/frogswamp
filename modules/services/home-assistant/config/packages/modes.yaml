# Modes. Automations read these switches. The calendar sets Day off and Vacation through
# automations/modes.yaml. Modes can overlap (e.g. Vacation off doesn't restart the desk while Day off is on)
input_boolean:
  day_off:
    name: Day off
    icon: mdi:beach
  vacation:
    name: Vacation
    icon: mdi:airplane
  guests_in_living_room:
    name: Guests in the living room
    icon: mdi:account-multiple

# calendar.home_assistant_events comes from Remote Calendar, added in the UI (its secret link stays in HA storage).
# All-day events count, titled "Vacation" or "Day off". Case, spaces and dashes in the title don't matter.
# A day off is also an all-day "Out of Office" in calendar.work_meetings (packages/work_meetings.yaml), or any day
# that the Workday integration says isn't a workday, so weekends and holidays turn the Day off switch on.
# Each source keeps its last known days if it can't be read
template:
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.home_assistant_events
            - calendar.work_meetings
        data:
          start_date_time: "{{ today_at() }}"
          end_date_time: "{{ today_at() + timedelta(days=3) }}"
        response_variable: calendar_events
        continue_on_error: true
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_pl
        data:
          check_date: "{{ now().date() + timedelta(days=0) }}"
        response_variable: workday_0
        continue_on_error: true
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_pl
        data:
          check_date: "{{ now().date() + timedelta(days=1) }}"
        response_variable: workday_1
        continue_on_error: true
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_pl
        data:
          check_date: "{{ now().date() + timedelta(days=2) }}"
        response_variable: workday_2
        continue_on_error: true
      - variables:
          modes: >-
            {% set entity = 'calendar.home_assistant_events' %}
            {% if calendar_events is defined and entity in calendar_events %}
              {% set ns = namespace(day_off=[], vacation=[]) %}
              {# An all-day event has a plain date of 10 characters as its start, and its end date is not included #}
              {% for event in calendar_events[entity].events if event.start | length == 10 %}
                {% set title = event.summary | lower | regex_replace('[\\s-]+', '') %}
                {% for offset in range(3) %}
                  {% set day = (now().date() + timedelta(days=offset)) | string %}
                  {% if event.start <= day < event.end %}
                    {% if title == 'dayoff' %}
                      {% set ns.day_off = ns.day_off + [day] %}
                    {% elif title == 'vacation' %}
                      {% set ns.vacation = ns.vacation + [day] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {{ {'day_off': ns.day_off | unique | sort, 'vacation': ns.vacation | unique | sort} }}
            {% else %}
              {{ none }}
            {% endif %}
          out_of_office: >-
            {% set entity = 'calendar.work_meetings' %}
            {% if calendar_events is defined and entity in calendar_events %}
              {% set ns = namespace(days=[]) %}
              {% for event in calendar_events[entity].events
                 if event.start | length == 10 and event.summary | lower | regex_replace('[\\s-]+', '') == 'outofoffice' %}
                {% for offset in range(3) %}
                  {% set day = (now().date() + timedelta(days=offset)) | string %}
                  {% if event.start <= day < event.end %}
                    {% set ns.days = ns.days + [day] %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {{ ns.days | unique | sort }}
            {% else %}
              {{ none }}
            {% endif %}
          non_working: >-
            {% set entity = 'binary_sensor.workday_sensor_pl' %}
            {% if workday_0 is defined and workday_1 is defined and workday_2 is defined %}
              {% set ns = namespace(days=[]) %}
              {% for offset, answer in [(0, workday_0), (1, workday_1), (2, workday_2)] if not answer[entity].workday %}
                {% set ns.days = ns.days + [(now().date() + timedelta(days=offset)) | string] %}
              {% endfor %}
              {{ ns.days }}
            {% else %}
              {{ none }}
            {% endif %}
    sensor:
      - name: Calendar modes
        unique_id: repo_calendar_modes
        icon: mdi:calendar-check
        state: "{{ (modes.day_off + modes.vacation) | length if modes else this.state | int(0) }}"
        attributes:
          day_off_events: "{{ modes.day_off if modes else this.attributes.get('day_off_events', []) }}"
          out_of_office: "{{ out_of_office if out_of_office is not none else this.attributes.get('out_of_office', []) }}"
          non_working: "{{ non_working if non_working is not none else this.attributes.get('non_working', []) }}"
          day_off: >-
            {{ ((modes.day_off if modes else this.attributes.get('day_off_events', []))
                + (out_of_office if out_of_office is not none else this.attributes.get('out_of_office', []))
                + (non_working if non_working is not none else this.attributes.get('non_working', []))) | unique | sort }}
          vacation: "{{ modes.vacation if modes else this.attributes.get('vacation', []) }}"

  - binary_sensor:
      - name: Calendar day off today
        unique_id: repo_calendar_day_off_today
        icon: mdi:beach
        state: "{{ now().date() | string in (state_attr('sensor.calendar_modes', 'day_off') or []) }}"
      - name: Calendar vacation today
        unique_id: repo_calendar_vacation_today
        icon: mdi:airplane
        state: "{{ now().date() | string in (state_attr('sensor.calendar_modes', 'vacation') or []) }}"
      # For bedtime. 12 h back from any time between noon and the next noon is the day the night started.
      # The switch counts for the next day only when today's event didn't turn it on, that event says nothing about tomorrow
      - name: Day off next day
        unique_id: repo_day_off_next_day
        icon: mdi:beach
        state: >-
          {{ ((now() - timedelta(hours=12)).date() + timedelta(days=1)) | string
                in (state_attr('sensor.calendar_modes', 'day_off') or [])
             or (is_state('input_boolean.day_off', 'on') and is_state('binary_sensor.calendar_day_off_today', 'off')) }}
