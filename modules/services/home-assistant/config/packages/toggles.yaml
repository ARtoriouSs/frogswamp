# Pairs of scripts as one on/off switch, for the Overview page and NeonPlan pins
template:
  - switch:
      - name: Bedroom curtains closed
        unique_id: repo_neonplan_bedroom_curtains_toggle
        default_entity_id: switch.bedroom_curtains_toggle
        icon: mdi:curtains-closed
        state: "{{ is_state('cover.bedroom_curtains_local', 'closed') }}"
        turn_on:
          - action: script.curtains_close
        turn_off:
          - action: script.curtains_open

      # Through script.floor_warming_set, like the schedule: on = manual at 45 °C, off = manual at 5 °C.
      # On while the thermostat heats in manual mode to more than 5 °C
      - name: Guest floor warming
        unique_id: repo_neonplan_guest_floor_warming
        icon: mdi:heating-coil
        state: >-
          {{ is_state('climate.thermostat_guest_local', 'heat')
             and state_attr('climate.thermostat_guest_local', 'temperature') | float(0) > 5 }}
        turn_on:
          - action: script.floor_warming_set
            data:
              bathroom: guest
              state: "on"
        turn_off:
          - action: script.floor_warming_set
            data:
              bathroom: guest
              state: "off"

      - name: Master floor warming
        unique_id: repo_neonplan_master_floor_warming
        icon: mdi:heating-coil
        state: >-
          {{ is_state('climate.thermostat_master_local', 'heat')
             and state_attr('climate.thermostat_master_local', 'temperature') | float(0) > 5 }}
        turn_on:
          - action: script.floor_warming_set
            data:
              bathroom: master
              state: "on"
        turn_off:
          - action: script.floor_warming_set
            data:
              bathroom: master
              state: "off"

      # The heater itself, on/off. A climate pin in NeonPlan opens its settings, a switch toggles
      - name: Guest towel heat
        unique_id: repo_neonplan_guest_towel_heat
        icon: mdi:radiator
        state: "{{ states('climate.guest_bathroom_towel_heat_guest') not in ['off', 'unavailable', 'unknown'] }}"
        turn_on:
          - action: climate.turn_on
            target:
              entity_id: climate.guest_bathroom_towel_heat_guest
        turn_off:
          - action: climate.turn_off
            target:
              entity_id: climate.guest_bathroom_towel_heat_guest
