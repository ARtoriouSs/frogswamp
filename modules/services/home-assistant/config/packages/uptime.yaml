# Device uptime for the Monitor tab of the Main dashboard. A device is offline while its main entity is
# unavailable (HA can't reach it), being off or closed still counts as online.
# history_stats reads the source entity's recorded history, so the numbers include the days before this file.
# The `<device> online` binary sensors draw the timelines, so their history starts when they were added.
# The blinds, curtains and thermostats watch their Tuya Local entities since 2026-11-01, so their offline %
# count from that day (the cloud entities before it are disabled)

# HA has no integration for the PC, so it only sees whether the PC answers. Two tries: one lost packet
# on a busy network is not an outage. The address is a DHCP reservation, see README
command_line:
  - binary_sensor:
      name: PC ping
      unique_id: repo_pc_ping
      command: ping -c 2 -W 1 192.168.101.127 >/dev/null && echo on || echo off
      payload_on: "on"
      payload_off: "off"
      device_class: connectivity
      scan_interval: 30
      command_timeout: 10

input_select:
  uptime_range:
    name: Uptime range
    icon: mdi:calendar-range
    options:
      - Day
      - Week
      - Month
    initial: Day

template:
  - binary_sensor:
      - name: Blinds right online
        unique_id: repo_uptime_blinds_right
        device_class: connectivity
        state: "{{ not is_state('cover.blinds_right_local', 'unavailable') }}"
        # The share of time online for the range picked in input_select.uptime_range
        attributes: &uptime_attributes
          uptime: >-
            {% set device = this.entity_id.split('.')[1] | replace('_online', '') %}
            {% set offline = states('sensor.' ~ device ~ '_offline_' ~ states('input_select.uptime_range') | lower) %}
            {{ (100 - offline | float(0)) | round(1) if offline | is_number else none }}
      - name: Blinds middle online
        unique_id: repo_uptime_blinds_middle
        device_class: connectivity
        state: "{{ not is_state('cover.blinds_middle_local', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Blinds left door online
        unique_id: repo_uptime_blinds_left_door
        device_class: connectivity
        state: "{{ not is_state('cover.blinds_left_door_local', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Tv online
        unique_id: repo_uptime_tv
        device_class: connectivity
        state: "{{ not is_state('media_player.living_room_philips_tv', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Fridge online
        unique_id: repo_uptime_fridge
        device_class: connectivity
        state: "{{ not is_state('sensor.living_room_refrigerator_fridge_temperature', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Curtains online
        unique_id: repo_uptime_curtains
        device_class: connectivity
        state: "{{ not is_state('cover.curtains_local', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Desk online
        unique_id: repo_uptime_desk
        device_class: connectivity
        state: "{{ not is_state('switch.desk_child_lock', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Cube online
        unique_id: repo_uptime_cube
        device_class: connectivity
        state: "{{ not is_state('light.cube_matrix_192_168_101_121', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: PC online
        unique_id: repo_uptime_pc
        device_class: connectivity
        state: "{{ is_state('binary_sensor.pc_ping', 'on') }}"
        attributes: *uptime_attributes
      - name: Printer online
        unique_id: repo_uptime_printer
        device_class: connectivity
        state: "{{ not is_state('sensor.office_printer', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Guest thermostat online
        unique_id: repo_uptime_guest_thermostat
        device_class: connectivity
        state: "{{ not is_state('climate.thermostat_guest_local', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Guest towel heat online
        unique_id: repo_uptime_guest_towel_heat
        device_class: connectivity
        state: "{{ not is_state('climate.guest_bathroom_towel_heat_guest', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Master thermostat online
        unique_id: repo_uptime_master_thermostat
        device_class: connectivity
        state: "{{ not is_state('climate.thermostat_master_local', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Master towel heat relay online
        unique_id: repo_uptime_master_towel_heat_relay
        device_class: connectivity
        state: "{{ not is_state('switch.master_bathroom_towel_heat_relay', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Router online
        unique_id: repo_uptime_router
        device_class: connectivity
        state: "{{ not is_state('binary_sensor.huawei_igd_wan_status', 'unavailable') }}"
        attributes: *uptime_attributes
      - name: Zigbee bridge online
        unique_id: repo_uptime_zigbee_bridge
        device_class: connectivity
        state: "{{ states('binary_sensor.zigbee2mqtt_bridge_connection_state') not in ['off', 'unavailable'] }}"
        attributes: *uptime_attributes
      - name: Audi online
        unique_id: repo_uptime_audi
        device_class: connectivity
        state: "{{ not is_state('sensor.garage_audi_a5_sportback_range', 'unavailable') }}"
        attributes: *uptime_attributes

# A ratio divides by the whole window, so time before an entity's first recorded state would count as online.
# The Week and Month windows start no earlier than that state, the dates do nothing once the window has passed them
sensor:
  - platform: history_stats
    name: Blinds right offline day
    unique_id: repo_uptime_blinds_right_offline_day
    entity_id: cover.blinds_right_local
    state: unavailable
    type: ratio
    end: &uptime_end "{{ now() }}"
    duration:
      hours: 24
  - platform: history_stats
    name: Blinds right offline week
    unique_id: repo_uptime_blinds_right_offline_week
    entity_id: cover.blinds_right_local
    state: unavailable
    type: ratio
    start: "{{ max(now() - timedelta(hours=168), '2026-11-01T16:55:22+01:00' | as_datetime) }}"
    end: *uptime_end
  - platform: history_stats
    name: Blinds right offline month
    unique_id: repo_uptime_blinds_right_offline_month
