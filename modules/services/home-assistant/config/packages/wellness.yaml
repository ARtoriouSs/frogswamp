# The Wellness tab. Its graphs are custom:frog-daily-chart cards (www/daily-chart.js) that draw daily
# long-term statistics and the calories sheet
input_select:
  # The range picker of the Wellness tab, one for all its graphs
  wellness_range:
    name: Wellness range
    icon: mdi:calendar-range
    options:
      - Month
      - 3 months
      - Year
    initial: Month
  # The range of the sleep and exercise timeline, separate from the daily graphs
  wellness_activity_range:
    name: Wellness activity range
    icon: mdi:calendar-today
    options:
      - Day
      - Week
    initial: Day

# Health Connect values from the Pixel 7 Companion app. The app's sensors have no state_class, so HA keeps
# no long-term statistics for them and the graphs would end after the 31-day history. These copies keep them
template:
  - sensor:
      - name: Health weight
        unique_id: repo_health_weight
        default_entity_id: sensor.health_weight
        icon: mdi:scale-bathroom
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_weight') }}"
        state: "{{ (states('sensor.pixel_7_weight') | float / 1000) | round(2) }}"
      - name: Health body fat
        unique_id: repo_health_body_fat
        default_entity_id: sensor.health_body_fat
        icon: mdi:water-percent
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_body_fat') }}"
        state: "{{ states('sensor.pixel_7_body_fat') | float | round(1) }}"
      - name: Health bone mass
        unique_id: repo_health_bone_mass
        default_entity_id: sensor.health_bone_mass
        icon: mdi:bone
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_bone_mass') }}"
        state: "{{ (states('sensor.pixel_7_bone_mass') | float / 1000) | round(2) }}"
      - name: Health body water mass
        unique_id: repo_health_body_water_mass
        default_entity_id: sensor.health_body_water_mass
        icon: mdi:water
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_body_water_mass') }}"
        state: "{{ (states('sensor.pixel_7_body_water_mass') | float / 1000) | round(2) }}"
      - name: Health heart rate
        unique_id: repo_health_heart_rate
        default_entity_id: sensor.health_heart_rate
        icon: mdi:heart-pulse
        unit_of_measurement: bpm
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_heart_rate') }}"
        state: "{{ states('sensor.pixel_7_heart_rate') | float | round(0) }}"
      - name: Health resting heart rate
        unique_id: repo_health_resting_heart_rate
        default_entity_id: sensor.health_resting_heart_rate
        icon: mdi:heart
        unit_of_measurement: bpm
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_resting_heart_rate') }}"
        state: "{{ states('sensor.pixel_7_resting_heart_rate') | float | round(0) }}"
      # The last sleep segment, only on the day it ended. Otherwise the daily max would also give
      # yesterday's sleep to the morning before the new segment arrives
      - name: Health sleep
        unique_id: repo_health_sleep
        default_entity_id: sensor.health_sleep
        icon: mdi:sleep
        unit_of_measurement: h
        state_class: measurement
        availability: >-
          {% set end = state_attr('sensor.pixel_7_sleep_segment', 'end') %}
          {{ has_value('sensor.pixel_7_sleep_segment') and end is number
             and (end / 1000) | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}
        state: "{{ (states('sensor.pixel_7_sleep_segment') | float / 3600000) | round(2) }}"

  # The calories sheet, published as CSV. The link is in secrets.yaml. The browser reads it, see www/daily-chart.js
  - sensor:
      - name: Calories sheet
        unique_id: repo_calories_sheet
        default_entity_id: sensor.calories_sheet
        icon: mdi:google-spreadsheet
        state: Published
        attributes:
          url: !secret calories_csv_url

# Hours asleep and in exercise from the watch's activity state. The daily max of each goes to the
# long-term statistics, so the graph keeps them after the 31-day history is gone
sensor:
  # From 18:00 to 18:00, so a night that crosses midnight counts as one, on the day it ends
  - platform: history_stats
    name: Watch sleep
    unique_id: repo_watch_sleep
    entity_id: sensor.google_pixel_watch_activity_state
    state: asleep
    type: time
    start: "{{ today_at('18:00') - timedelta(days=1 if now() < today_at('18:00') else 0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Watch exercise
    unique_id: repo_watch_exercise
    entity_id: sensor.google_pixel_watch_activity_state
    state: exercise
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
