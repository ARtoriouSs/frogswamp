# The Wellness tab. Its graphs are custom:frog-daily-chart cards (www/daily-chart.js) that draw daily
# long-term statistics and the calories sheet
input_select:
  # The range picker of the Wellness tab, one for all its graphs
  wellness_range:
    name: Wellness range
    icon: mdi:calendar-range
    options:
      - Day
      - Week
      - Month
      - 3 months
      - Year
    initial: Month

# Health Connect values from the Pixel 7 Companion app. The app's sensors have no state_class, so HA keeps
# no long-term statistics for them and the graphs would end after the 31-day history. These copies keep them
template:
  - sensor:
      - name: Health weight
        unique_id: repo_health_weight
        default_entity_id: sensor.health_weight
        icon: mdi:scale-bathroom
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_weight') }}"
        state: "{{ (states('sensor.pixel_7_weight') | float / 1000) | round(2) }}"
      - name: Health body fat
        unique_id: repo_health_body_fat
        default_entity_id: sensor.health_body_fat
        icon: mdi:water-percent
        unit_of_measurement: "%"
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_body_fat') }}"
        state: "{{ states('sensor.pixel_7_body_fat') | float | round(1) }}"
      - name: Health bone mass
        unique_id: repo_health_bone_mass
        default_entity_id: sensor.health_bone_mass
        icon: mdi:bone
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_bone_mass') }}"
        state: "{{ (states('sensor.pixel_7_bone_mass') | float / 1000) | round(2) }}"
      - name: Health body water mass
        unique_id: repo_health_body_water_mass
        default_entity_id: sensor.health_body_water_mass
        icon: mdi:water
        unit_of_measurement: kg
        device_class: weight
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_body_water_mass') }}"
        state: "{{ (states('sensor.pixel_7_body_water_mass') | float / 1000) | round(2) }}"
      - name: Health heart rate
        unique_id: repo_health_heart_rate
        default_entity_id: sensor.health_heart_rate
        icon: mdi:heart-pulse
        unit_of_measurement: bpm
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_heart_rate') }}"
        state: "{{ states('sensor.pixel_7_heart_rate') | float | round(0) }}"
      - name: Health resting heart rate
        unique_id: repo_health_resting_heart_rate
        default_entity_id: sensor.health_resting_heart_rate
        icon: mdi:heart
        unit_of_measurement: bpm
        state_class: measurement
        availability: "{{ has_value('sensor.pixel_7_resting_heart_rate') }}"
        state: "{{ states('sensor.pixel_7_resting_heart_rate') | float | round(0) }}"
      # The last sleep segment, only on the day it ended. Otherwise the daily max would also give
      # yesterday's sleep to the morning before the new segment arrives
      - name: Health sleep
        unique_id: repo_health_sleep
        default_entity_id: sensor.health_sleep
        icon: mdi:sleep
        unit_of_measurement: h
        state_class: measurement
        availability: >-
          {% set end = state_attr('sensor.pixel_7_sleep_segment', 'end') %}
          {{ has_value('sensor.pixel_7_sleep_segment') and end is number
             and (end / 1000) | timestamp_custom('%Y-%m-%d') == now().strftime('%Y-%m-%d') }}
        state: "{{ (states('sensor.pixel_7_sleep_segment') | float / 3600000) | round(2) }}"

  # The daily calories CSV. The nutrition-sync service builds it from the Notion log, HA serves it from www/nutrition.
  # The browser reads it, see www/daily-chart.js
  - sensor:
      - name: Calories sheet
        unique_id: repo_calories_sheet
        default_entity_id: sensor.calories_sheet
        icon: mdi:google-spreadsheet
        state: Published
        attributes:
          url: /local/nutrition/daily.csv
          meals_url: /local/nutrition/meals.csv

  # Running sum and count of the body measurements, so the charts can show a day as the average of what was measured
  # on it (the day's change of the sum / of the count). A measurement is new when its Health Connect date is new.
  # The start trigger gives the counters a 0 to start from
  - triggers:
      - trigger: state
        entity_id: sensor.pixel_7_weight
      - trigger: homeassistant
        event: start
    conditions: &body_measured_conditions
      - condition: template
        value_template: "{{ trigger.platform != 'state' or trigger.to_state.state | is_number }}"
    sensor:
      - name: Health weight measured sum
        unique_id: repo_health_weight_measured_sum
        default_entity_id: sensor.health_weight_measured_sum
        unit_of_measurement: "kg"
        state_class: total_increasing
        state: &body_measured_sum >-
          {% set new = trigger.platform == 'state'
             and trigger.to_state.attributes.get('date', trigger.to_state.last_updated) | string != this.attributes.get('taken') %}
          {% set scale = 1 if trigger.entity_id is defined and trigger.entity_id.endswith('_fat') else 0.001 %}
          {{ (this.state | float(0) + (trigger.to_state.state | float * scale if new else 0)) | round(3) }}
        attributes:
          taken: &body_measured_taken >-
            {{ trigger.to_state.attributes.get('date', trigger.to_state.last_updated) | string
               if trigger.platform == 'state' else this.attributes.get('taken') }}
      - name: Health weight measured count
        unique_id: repo_health_weight_measured_count
        default_entity_id: sensor.health_weight_measured_count
        state_class: total_increasing
        state: &body_measured_count >-
          {% set new = trigger.platform == 'state'
             and trigger.to_state.attributes.get('date', trigger.to_state.last_updated) | string != this.attributes.get('taken') %}
          {{ this.state | int(0) + (1 if new else 0) }}
        attributes:
          taken: *body_measured_taken
  - triggers:
      - trigger: state
        entity_id: sensor.pixel_7_body_water_mass
      - trigger: homeassistant
        event: start
    conditions: *body_measured_conditions
    sensor:
      - name: Health body water measured sum
        unique_id: repo_health_body_water_measured_sum
        default_entity_id: sensor.health_body_water_measured_sum
        unit_of_measurement: "kg"
        state_class: total_increasing
        state: *body_measured_sum
        attributes:
          taken: *body_measured_taken
      - name: Health body water measured count
        unique_id: repo_health_body_water_measured_count
        default_entity_id: sensor.health_body_water_measured_count
        state_class: total_increasing
        state: *body_measured_count
        attributes:
          taken: *body_measured_taken
  - triggers:
      - trigger: state
        entity_id: sensor.pixel_7_bone_mass
      - trigger: homeassistant
        event: start
    conditions: *body_measured_conditions
    sensor:
      - name: Health bone mass measured sum
        unique_id: repo_health_bone_mass_measured_sum
        default_entity_id: sensor.health_bone_mass_measured_sum
        unit_of_measurement: "kg"
        state_class: total_increasing
        state: *body_measured_sum
        attributes:
          taken: *body_measured_taken
      - name: Health bone mass measured count
        unique_id: repo_health_bone_mass_measured_count
        default_entity_id: sensor.health_bone_mass_measured_count
        state_class: total_increasing
        state: *body_measured_count
        attributes:
          taken: *body_measured_taken
  - triggers:
      - trigger: state
        entity_id: sensor.pixel_7_body_fat
      - trigger: homeassistant
        event: start
    conditions: *body_measured_conditions
    sensor:
      - name: Health body fat measured sum
        unique_id: repo_health_body_fat_measured_sum
        default_entity_id: sensor.health_body_fat_measured_sum
        unit_of_measurement: "%"
        state_class: total_increasing
        state: *body_measured_sum
        attributes:
          taken: *body_measured_taken
      - name: Health body fat measured count
        unique_id: repo_health_body_fat_measured_count
        default_entity_id: sensor.health_body_fat_measured_count
        state_class: total_increasing
        state: *body_measured_count
        attributes:
          taken: *body_measured_taken

  # Eaten today as % of the daily goal, for the bars and the over-goal alert. Unavailable while the goal is 0
  - sensor:
      - name: Nutrition calories of goal
        unique_id: repo_nutrition_kcal_of_goal
        default_entity_id: sensor.nutrition_kcal_of_goal
        icon: mdi:food-apple
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.nutrition_today_kcal') and states('input_number.nutrition_goal_kcal') | float(0) > 0 }}"
        state: "{{ (states('sensor.nutrition_today_kcal') | float / states('input_number.nutrition_goal_kcal') | float * 100) | round(0) }}"
        attributes:
          label: Calories
          unit: kcal
          eaten: "{{ states('sensor.nutrition_today_kcal') | float(0) | round(0) }}"
          goal: "{{ states('input_number.nutrition_goal_kcal') | float(0) | round(0) }}"
      - name: Nutrition fats of goal
        unique_id: repo_nutrition_fats_of_goal
        default_entity_id: sensor.nutrition_fats_of_goal
        icon: mdi:oil
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.nutrition_today_fats') and states('input_number.nutrition_goal_fats') | float(0) > 0 }}"
        state: "{{ (states('sensor.nutrition_today_fats') | float / states('input_number.nutrition_goal_fats') | float * 100) | round(0) }}"
        attributes:
          label: Fats
          unit: g
          eaten: "{{ states('sensor.nutrition_today_fats') | float(0) | round(0) }}"
          goal: "{{ states('input_number.nutrition_goal_fats') | float(0) | round(0) }}"
      - name: Nutrition proteins of goal
        unique_id: repo_nutrition_proteins_of_goal
        default_entity_id: sensor.nutrition_proteins_of_goal
        icon: mdi:food-drumstick
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.nutrition_today_proteins') and states('input_number.nutrition_goal_proteins') | float(0) > 0 }}"
        state: "{{ (states('sensor.nutrition_today_proteins') | float / states('input_number.nutrition_goal_proteins') | float * 100) | round(0) }}"
        attributes:
          label: Proteins
          unit: g
          eaten: "{{ states('sensor.nutrition_today_proteins') | float(0) | round(0) }}"
          goal: "{{ states('input_number.nutrition_goal_proteins') | float(0) | round(0) }}"
      - name: Nutrition carbohydrates of goal
        unique_id: repo_nutrition_carbohydrates_of_goal
        default_entity_id: sensor.nutrition_carbohydrates_of_goal
        icon: mdi:bread-slice
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.nutrition_today_carbohydrates') and states('input_number.nutrition_goal_carbohydrates') | float(0) > 0 }}"
        state: "{{ (states('sensor.nutrition_today_carbohydrates') | float / states('input_number.nutrition_goal_carbohydrates') | float * 100) | round(0) }}"
        attributes:
          label: Carbohydrates
          unit: g
          eaten: "{{ states('sensor.nutrition_today_carbohydrates') | float(0) | round(0) }}"
          goal: "{{ states('input_number.nutrition_goal_carbohydrates') | float(0) | round(0) }}"

# Today's meals and the sync health from the nutrition-sync service (modules/services/nutrition)
rest:
  - resource: http://127.0.0.1:8131/status
    scan_interval: 300
    sensor:
      - name: Nutrition today kcal
        unique_id: repo_nutrition_today_kcal
        icon: mdi:food-apple
        unit_of_measurement: kcal
        state_class: measurement
        value_template: "{{ value_json.today.kcal }}"
      - name: Nutrition today fats
        unique_id: repo_nutrition_today_fats
        icon: mdi:oil
        unit_of_measurement: g
        state_class: measurement
        value_template: "{{ value_json.today.fats }}"
      - name: Nutrition today proteins
        unique_id: repo_nutrition_today_proteins
        icon: mdi:food-drumstick
        unit_of_measurement: g
        state_class: measurement
        value_template: "{{ value_json.today.proteins }}"
      - name: Nutrition today carbohydrates
        unique_id: repo_nutrition_today_carbohydrates
        icon: mdi:bread-slice
        unit_of_measurement: g
        state_class: measurement
        value_template: "{{ value_json.today.carbohydrates }}"
      - name: Nutrition last read
        unique_id: repo_nutrition_last_read
        device_class: timestamp
        icon: mdi:database-sync
        value_template: "{{ value_json.last_read }}"
      # invalid_grant means the Google login is gone; other codes mean Google refused a meal
      - name: Nutrition Google error
        unique_id: repo_nutrition_google_error
        icon: mdi:google
        value_template: "{{ value_json.google.error or 'none' }}"
    binary_sensor:
      - name: Nutrition Google ok
        unique_id: repo_nutrition_google_ok
        icon: mdi:google
        value_template: "{{ value_json.google.ok }}"

# Hours asleep and in exercise from the watch's activity state. The daily max of each goes to the
# long-term statistics, so the graph keeps them after the 31-day history is gone
sensor:
  # By calendar day: a night that crosses midnight counts on both days
  - platform: history_stats
    name: Watch sleep
    unique_id: repo_watch_sleep
    entity_id: sensor.google_pixel_watch_activity_state
    state: asleep
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Watch exercise
    unique_id: repo_watch_exercise
    entity_id: sensor.google_pixel_watch_activity_state
    state: exercise
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

# Daily nutrition goals, set on the Wellness tab. Google Health has no API for its goals.
# No `initial`, so HA keeps them over restarts. 0 means no goal
input_number:
  nutrition_goal_kcal:
    name: Calories goal
    icon: mdi:food-apple
    min: 0
    max: 6000
    step: 10
    mode: box
    unit_of_measurement: kcal
  nutrition_goal_fats:
    name: Fats goal
    icon: mdi:oil
    min: 0
    max: 600
    step: 1
    mode: box
    unit_of_measurement: g
  nutrition_goal_proteins:
    name: Proteins goal
    icon: mdi:food-drumstick
    min: 0
    max: 600
    step: 1
    mode: box
    unit_of_measurement: g
  nutrition_goal_carbohydrates:
    name: Carbohydrates goal
    icon: mdi:bread-slice
    min: 0
    max: 600
    step: 1
    mode: box
    unit_of_measurement: g
