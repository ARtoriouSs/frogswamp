# Cube quiet mode (automations/cube.yaml): the green dot at 0% from bedtime to wakeup
# and during Vacation. Keeps its state over HA restarts
input_boolean:
  cube_night:
    name: Cube night
    icon: mdi:weather-night

# The cube for NeonPlan: on while it shows frogs and the rest, off while it is the dot at 0%
# (an event animation at night shows it on for that time). A light, because NeonPlan lamps
# take lights, switches and helpers. A tap in the plan puts the dot on or brings the frogs back
template:
  - light:
      - name: Cube Matrix visible
        unique_id: repo_cube_visible
        icon: mdi:cube-outline
        state: >-
          {{ is_state('light.cube_matrix_192_168_101_121', 'on')
             and not (is_state('select.cube_matrix_192_168_101_121_background', 'dot')
                      and state_attr('light.cube_matrix_192_168_101_121', 'brightness') | int(0) <= 1) }}
        turn_on:
          - action: script.cube_wake
        turn_off:
          - action: script.cube_sleep
