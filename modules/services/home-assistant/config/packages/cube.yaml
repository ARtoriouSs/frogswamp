# Cube quiet mode (automations/cube.yaml): the green dot at 0% from bedtime to wakeup
# and during Vacation. Keeps its state over HA restarts
input_boolean:
  cube_night:
    name: Cube night
    icon: mdi:weather-night

template:
  # The Overview toggle: on at 100%, off at 0% (brightness 1, see scripts/cube.yaml)
  - switch:
      - name: Cube bright
        unique_id: repo_cube_bright
        icon: mdi:brightness-7
        state: "{{ state_attr('light.cube_matrix_192_168_101_121', 'brightness') | int(0) > 1 }}"
        turn_on:
          - action: script.cube_brightness_on
        turn_off:
          - action: script.cube_brightness_off
