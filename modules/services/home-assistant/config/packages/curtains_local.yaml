# The bedroom curtains through Tuya Local. Its config doesn't know the motor's "reverse" setting, so
# cover.curtains_local is upside down: its "open" closes the curtains and its position 100 means closed.
# This cover turns it the right way round; automations and the dashboard use this one, not curtains_local.
# Part of the Tuya Local migration (docs/superpowers/plans/2026-10-31-tuya-local-migration.md)
template:
  - cover:
      - name: Bedroom curtains (local)
        unique_id: repo_bedroom_curtains_local
        default_entity_id: cover.bedroom_curtains_local
        device_class: curtain
        availability: "{{ has_value('cover.curtains_local') }}"
        position: >-
          {% set p = state_attr('cover.curtains_local', 'current_position') %}
          {{ 100 - p | int if p is number else none }}
        open_cover:
          - action: cover.close_cover
            target:
              entity_id: cover.curtains_local
        close_cover:
          - action: cover.open_cover
            target:
              entity_id: cover.curtains_local
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id: cover.curtains_local
        set_cover_position:
          - action: cover.set_cover_position
            target:
              entity_id: cover.curtains_local
            data:
              position: "{{ 100 - position }}"
