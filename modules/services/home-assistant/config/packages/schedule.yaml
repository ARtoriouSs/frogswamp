# Daily timings that automations use in their time triggers (with an offset when needed, e.g.
# floor warming starts 1 h before wakeup). They work like constants: a change made in the UI
# is reset to `initial` on the next HA restart, so change them here.
# Workdays come from the Workday integration (binary_sensor.workday_sensor), so holidays count as
# weekend days. Wakeup depends on the day itself, bedtime on the next day: an early bedtime before
# a workday, a late one before a weekend day or a holiday. Day off on counts as a weekend day.
# Work is only on workdays
input_datetime:
  wakeup_workday:
    name: Wakeup on workdays
    icon: mdi:alarm
    has_date: false
    has_time: true
    initial: "09:30:00"
  wakeup_weekend:
    name: Wakeup on weekends and holidays
    icon: mdi:alarm
    has_date: false
    has_time: true
    initial: "11:00:00"
  bedtime_workday:
    name: Bedtime before a workday
    icon: mdi:bed
    has_date: false
    has_time: true
    initial: "00:00:00"
  bedtime_weekend:
    name: Bedtime before a weekend day or holiday
    icon: mdi:bed
    has_date: false
    has_time: true
    initial: "01:00:00"
  work_start:
    name: Work start
    icon: mdi:briefcase
    has_date: false
    has_time: true
    initial: "10:00:00"
  work_end:
    name: Work end
    icon: mdi:briefcase-off
    has_date: false
    has_time: true
    initial: "19:00:00"
