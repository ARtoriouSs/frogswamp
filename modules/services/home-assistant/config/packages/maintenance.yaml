    has_time: false
  car_air_filter_changed:
    name: Air filter date
    icon: mdi:calendar-check
    has_date: true
    has_time: false
  car_cabin_filter_changed:
    name: Cabin filter date
    icon: mdi:calendar-check
    has_date: true
    has_time: false
  car_fuel_filter_changed:
    name: Fuel filter date
    icon: mdi:calendar-check
    has_date: true
    has_time: false
  car_gearbox_hydraulic_changed:
    name: Gearbox hydraulic date
    icon: mdi:calendar-check
    has_date: true
    has_time: false
  car_gearbox_mechanical_changed:
    name: Gearbox mechanical date
    icon: mdi:calendar-check
    has_date: true
    has_time: false
  car_inspection_changed:
    name: Inspection date
    icon: mdi:calendar-check
    has_date: true
