script:
  fridge_filter_reset:
    alias: Fridge filter changed
    icon: mdi:filter
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.fridge_filter_changed
        data:
          date: "{{ now().date() }}"
  # With no odometer value (or for the inspection, which has no km) only the date is saved
  car_part_reset:
    alias: Car part changed
    icon: mdi:wrench
    fields:
      part:
        description: The middle of the helper names, for example oil
        required: true
        selector:
          text:
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.car_{{ part }}_changed"
        data:
          date: "{{ now().date() }}"
      - if: "{{ has_value('input_number.car_' ~ part ~ '_km') and has_value('sensor.garage_audi_a5_sportback_odometer') }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: "input_number.car_{{ part }}_km"
            data:
              value: "{{ states('sensor.garage_audi_a5_sportback_odometer') | float }}"

template:
  - sensor:
      # Falls from 100% to 0% in the 365 days after the change
      - name: Fridge filter capacity
        unique_id: fridge_filter_capacity
        icon: mdi:filter
        unit_of_measurement: "%"
        state: >-
          {% set changed = states('input_datetime.fridge_filter_changed') | as_datetime | as_local %}
          {% set days = (now() - changed).total_seconds() / 86400 %}
          {{ [0, [100, 100 - days / 365 * 100] | min] | max | round(1) }}

      # The numbers are the service rules: km, then days, 0 when there is no such limit
      - name: Car oil
        unique_id: car_part_oil
        icon: mdi:oil
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('oil', 15000, 365) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('oil') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('oil', 15000) }}"
          days_left: "{% from 'car_parts.jinja' import days_left %}{{ days_left('oil', 365) }}"
      - name: Car air filter
        unique_id: car_part_air_filter
        icon: mdi:air-filter
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('air_filter', 20000, 730) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('air_filter') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('air_filter', 20000) }}"
          days_left: "{% from 'car_parts.jinja' import days_left %}{{ days_left('air_filter', 730) }}"
      - name: Car cabin filter
        unique_id: car_part_cabin_filter
        icon: mdi:air-purifier
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('cabin_filter', 30000, 730) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('cabin_filter') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('cabin_filter', 30000) }}"
          days_left: "{% from 'car_parts.jinja' import days_left %}{{ days_left('cabin_filter', 730) }}"
      - name: Car fuel filter
        unique_id: car_part_fuel_filter
        icon: mdi:filter
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('fuel_filter', 60000, 0) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('fuel_filter') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('fuel_filter', 60000) }}"
      - name: Car gearbox hydraulic
        unique_id: car_part_gearbox_hydraulic
        icon: mdi:car-shift-pattern
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('gearbox_hydraulic', 60000, 0) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('gearbox_hydraulic') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('gearbox_hydraulic', 60000) }}"
      - name: Car gearbox mechanical
        unique_id: car_part_gearbox_mechanical
        icon: mdi:car-shift-pattern
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('gearbox_mechanical', 120000, 0) }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('gearbox_mechanical') }}"
        attributes:
          km_left: "{% from 'car_parts.jinja' import km_left %}{{ km_left('gearbox_mechanical', 120000) }}"
      - name: Car inspection
        unique_id: car_part_inspection
        icon: mdi:clipboard-check
        unit_of_measurement: "%"
        state: "{% from 'car_parts.jinja' import capacity %}{{ capacity('inspection', 0, 365) }}"
        attributes:
          days_left: "{% from 'car_parts.jinja' import days_left %}{{ days_left('inspection', 365) }}"

      # Changed by condition, so these only count the km since the change
      - name: Car front pads
        unique_id: car_part_front_pads
        icon: mdi:car-brake-alert
        unit_of_measurement: km
        state: "{% from 'car_parts.jinja' import km_used %}{{ km_used('front_pads') }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('front_pads') }}"
      - name: Car front discs
        unique_id: car_part_front_discs
        icon: mdi:disc
        unit_of_measurement: km
        state: "{% from 'car_parts.jinja' import km_used %}{{ km_used('front_discs') }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('front_discs') }}"
      - name: Car rear pads
        unique_id: car_part_rear_pads
        icon: mdi:car-brake-alert
        unit_of_measurement: km
        state: "{% from 'car_parts.jinja' import km_used %}{{ km_used('rear_pads') }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('rear_pads') }}"
      - name: Car rear discs
        unique_id: car_part_rear_discs
        icon: mdi:disc
        unit_of_measurement: km
        state: "{% from 'car_parts.jinja' import km_used %}{{ km_used('rear_discs') }}"
        availability: "{% from 'car_parts.jinja' import km_known %}{{ km_known('rear_discs') }}"
