# The range picker of the Climate tab
input_select:
  climate_range:
    name: Climate range
    icon: mdi:calendar-range
    options:
      - Day
      - Week
      - Month
      - Year
    initial: Day

# Room temperatures from the bathroom thermostats. Their sensors hang outside, by the bathroom doors,
# and are set to show the air there, not the floor. The thermostats stay in the bathrooms, these
# sensors go to the rooms (areas can only be set in the UI, see README)
template:
  - sensor:
      # Graphs can't read the weather entity's attribute, so it needs its own sensor
      - name: Outside temperature
        unique_id: repo_outside_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ state_attr('weather.forecast_home_assistant', 'temperature') }}"
        availability: "{{ state_attr('weather.forecast_home_assistant', 'temperature') is number }}"
      - name: Bedroom temperature
        unique_id: repo_bedroom_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.thermostat_master_local', 'current_temperature') }}"
        availability: "{{ state_attr('climate.thermostat_master_local', 'current_temperature') is number }}"
      - name: Hall temperature
        unique_id: repo_hall_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ state_attr('climate.thermostat_guest_local', 'current_temperature') }}"
        availability: "{{ state_attr('climate.thermostat_guest_local', 'current_temperature') is number }}"

      # The towel heater's sensor sits by its electronics and reads ~15 °C too warm. Its own correction
      # is set to -5 (the most it allows, in the Tuya app or HA), the other -10 is here. Not in the Home
      # average: it's a bathroom
      - name: Guest bathroom temperature
        unique_id: repo_guest_bathroom_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: "{{ (state_attr('climate.guest_bathroom_towel_heat_guest', 'current_temperature') - 10) | round(1) }}"
        availability: "{{ state_attr('climate.guest_bathroom_towel_heat_guest', 'current_temperature') is number }}"

      # Average of the rooms above, a room that is offline is left out. Add new room sensors to the list
      - name: Home temperature
        unique_id: repo_home_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°C"
        state: >-
          {% set values = ['sensor.bedroom_temperature', 'sensor.hall_temperature']
             | map('states') | map('float', none) | reject('none') | list %}
          {{ (values | sum / values | count) | round(1) }}
        availability: >-
          {{ ['sensor.bedroom_temperature', 'sensor.hall_temperature']
             | map('states') | map('float', none) | reject('none') | list | count > 0 }}
