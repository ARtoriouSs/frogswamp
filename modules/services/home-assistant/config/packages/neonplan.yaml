# Stand-ins for NeonPlan 3D lamps that have no smart light yet.
# A tap on the lamp in 3D toggles them; `initial` puts them back on every HA restart
# (input_boolean.true and input_boolean.false; the keys are quoted, or YAML reads them as booleans)
input_boolean:
  "true":
    name: "True"
    icon: mdi:lightbulb-on
    initial: true
  "false":
    name: "False"
    icon: mdi:lightbulb-off
    initial: false

# Scenes as switches, so they can be placed as pins on the NeonPlan plan (scenes can't be placed there).
# A tap on a pin toggles its switch
template:
  - switch:
      # For lamps that go dark on Vacation. A tap does nothing, Vacation is turned on and off on its own card
      - name: Vacation mode inverted
        unique_id: repo_neonplan_vacation_mode_inverted
        icon: mdi:airplane-off
        state: "{{ is_state('input_boolean.vacation', 'off') }}"
        turn_on: []
        turn_off: []

      - name: Bedroom curtains closed
        unique_id: repo_neonplan_bedroom_curtains_closed
        icon: mdi:curtains-closed
        state: "{{ is_state('cover.bedroom_curtains', 'closed') }}"
        turn_on:
          - action: scene.turn_on
            target:
              entity_id: scene.bedroom_curtains_close
        turn_off:
          - action: scene.turn_on
            target:
              entity_id: scene.bedroom_curtains_open

      # The blinds don't report their slats, so "closed" means Full close ran after every other blinds scene
      - name: Living room blinds closed
        unique_id: repo_neonplan_living_room_blinds_closed
        icon: mdi:blinds
        state: >-
          {% set closed = as_timestamp(states('scene.living_room_blinds_full_close'), 0) %}
          {{ closed > 0 and closed > [
               as_timestamp(states('scene.living_room_blinds_open'), 0),
               as_timestamp(states('scene.living_room_blinds_full_close_open'), 0),
               as_timestamp(states('scene.living_room_blinds_full_open_door'), 0)
             ] | max }}
        turn_on:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_blinds_full_close
        turn_off:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_blinds_open

      # On while Open door is the last blinds scene. Reset closes the door again: full close, then the slats open
      - name: Living room blinds open door
        unique_id: repo_neonplan_living_room_blinds_open_door
        icon: mdi:door-open
        state: >-
          {% set door = as_timestamp(states('scene.living_room_blinds_full_open_door'), 0) %}
          {{ door > 0 and door > [
               as_timestamp(states('scene.living_room_blinds_open'), 0),
               as_timestamp(states('scene.living_room_blinds_full_close'), 0),
               as_timestamp(states('scene.living_room_blinds_full_close_open'), 0)
             ] | max }}
        turn_on:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_blinds_full_open_door
        turn_off:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_blinds_full_close_open

      # Push button: always off, so every tap runs the scene
      - name: Living room blinds reset
        unique_id: repo_neonplan_living_room_blinds_reset
        icon: mdi:restore
        state: "{{ false }}"
        turn_on:
          - action: scene.turn_on
            target:
              entity_id: scene.living_room_blinds_full_close_open
        turn_off: []

      # Heaters as on/off pins (a climate pin opens its settings, a switch pin toggles)
      - name: Guest floor warming
        unique_id: repo_neonplan_guest_floor_warming
        icon: mdi:heating-coil
        state: "{{ states('climate.guest_bathroom_thermostat_guest') not in ['off', 'unavailable', 'unknown'] }}"
        turn_on:
          - action: climate.turn_on
            target:
              entity_id: climate.guest_bathroom_thermostat_guest
        turn_off:
          - action: climate.turn_off
            target:
              entity_id: climate.guest_bathroom_thermostat_guest

      - name: Master floor warming
        unique_id: repo_neonplan_master_floor_warming
        icon: mdi:heating-coil
        state: "{{ states('climate.master_bathroom_thermostat_master') not in ['off', 'unavailable', 'unknown'] }}"
        turn_on:
          - action: climate.turn_on
            target:
              entity_id: climate.master_bathroom_thermostat_master
        turn_off:
          - action: climate.turn_off
            target:
              entity_id: climate.master_bathroom_thermostat_master

      - name: Guest towel heat
        unique_id: repo_neonplan_guest_towel_heat
        icon: mdi:radiator
        state: "{{ states('climate.guest_bathroom_towel_heat_guest') not in ['off', 'unavailable', 'unknown'] }}"
        turn_on:
          - action: climate.turn_on
            target:
              entity_id: climate.guest_bathroom_towel_heat_guest
        turn_off:
          - action: climate.turn_off
            target:
              entity_id: climate.guest_bathroom_towel_heat_guest

      # On = standing. The desk doesn't report its height, so the last desk scene tells
      - name: Desk standing
        unique_id: repo_neonplan_desk_standing
        icon: mdi:desk
        state: >-
          {{ as_timestamp(states('scene.office_desk_up'), 0) > as_timestamp(states('scene.office_desk_down'), 0) }}
        turn_on:
          - action: script.desk_up
        turn_off:
          - action: script.desk_down

  # Copies of sensors NeonPlan doesn't list (it shows only some sensor types in a room).
  # They have no area, and NeonPlan lists any number sensor with a unit under "No area"
  - sensor:
      - name: Printer black ink
        unique_id: repo_neonplan_printer_black_ink
        icon: mdi:printer
        unit_of_measurement: "%"
        state: "{{ states('sensor.office_hp_tango_black_cartridge') }}"
        availability: "{{ has_value('sensor.office_hp_tango_black_cartridge') }}"

      - name: Printer color ink
        unique_id: repo_neonplan_printer_color_ink
        icon: mdi:printer
        unit_of_measurement: "%"
        state: "{{ states('sensor.office_printer_tri_color_cartridge') }}"
        availability: "{{ has_value('sensor.office_printer_tri_color_cartridge') }}"

      # The router reports KiB/s, Mbit/s reads better
      - name: Internet download
        unique_id: repo_neonplan_internet_download
        icon: mdi:download-network-outline
        unit_of_measurement: Mbit/s
        state: "{{ (states('sensor.hall_router_donwload_speed') | float * 8 * 1024 / 1000000) | round(2) }}"
        availability: "{{ has_value('sensor.hall_router_donwload_speed') }}"

      - name: Internet upload
        unique_id: repo_neonplan_internet_upload
        icon: mdi:upload-network-outline
        unit_of_measurement: Mbit/s
        state: "{{ (states('sensor.hall_router_upload_speed') | float * 8 * 1024 / 1000000) | round(2) }}"
        availability: "{{ has_value('sensor.hall_router_upload_speed') }}"

      - name: Torrent download
        unique_id: repo_neonplan_torrent_download
        icon: mdi:download
        unit_of_measurement: MB/s
        state: "{{ states('sensor.qbittorrent_download_speed') | float | round(1) }}"
        availability: "{{ has_value('sensor.qbittorrent_download_speed') }}"

      - name: Torrent upload
        unique_id: repo_neonplan_torrent_upload
        icon: mdi:upload
        unit_of_measurement: MB/s
        state: "{{ states('sensor.qbittorrent_upload_speed') | float | round(1) }}"
        availability: "{{ has_value('sensor.qbittorrent_upload_speed') }}"

      # A pin shows a text state as it is, so the alarm time reads 09:30. NeonPlan doesn't list text sensors
      # for placing, so to place it again: put a number in for a moment (with a unit), place it, then put this back.
      # Without a set alarm it is unknown
      - name: Next alarm
        unique_id: repo_neonplan_next_alarm
        icon: mdi:alarm
        state: >-
          {% set alarm = states('sensor.pixel_7_next_alarm') | as_datetime %}
          {{ alarm | as_local | as_timestamp | timestamp_custom('%H:%M') if alarm else none }}
