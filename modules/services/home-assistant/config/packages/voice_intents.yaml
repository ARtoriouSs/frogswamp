# Actions for the voice phrases in custom_sentences/ru/voice.yaml
intent_script:
  FrogBlindsOpen:
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_blinds_open
    speech:
      text: "Открываю жалюзи"
  FrogBlindsClose:
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_blinds_full_close
    speech:
      text: "Закрываю жалюзи"
  FrogBalconyDoorOpen:
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_blinds_full_open_door
    speech:
      text: "Открываю дверь на балкон"
  FrogCurtainsOpen:
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_curtains_open
    speech:
      text: "Открываю шторы"
  FrogCurtainsClose:
    action:
      - action: scene.turn_on
        target:
          entity_id: scene.bedroom_curtains_close
    speech:
      text: "Закрываю шторы"
  FrogFloorHeatingOn:
    action:
      - action: climate.turn_on
        target:
          entity_id: "{{ {'guest': 'climate.guest_bathroom_thermostat_guest', 'master': 'climate.master_bathroom_thermostat_master'}[bathroom] }}"
    speech:
      text: "Включаю тёплый пол"
  FrogFloorHeatingOff:
    action:
      - action: climate.turn_off
        target:
          entity_id: "{{ {'guest': 'climate.guest_bathroom_thermostat_guest', 'master': 'climate.master_bathroom_thermostat_master'}[bathroom] }}"
    speech:
      text: "Выключаю тёплый пол"
  # guest towel heat is a Tuya climate, master one a Zigbee relay; homeassistant.turn_on/off works for both
  FrogTowelHeatOn:
    action:
      - action: homeassistant.turn_on
        target:
          entity_id: "{{ {'guest': 'climate.guest_bathroom_towel_heat_guest', 'master': 'switch.master_bathroom_towel_heat_relay'}[bathroom] }}"
    speech:
      text: "Включаю полотенцесушитель"
  FrogTowelHeatOff:
    action:
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ {'guest': 'climate.guest_bathroom_towel_heat_guest', 'master': 'switch.master_bathroom_towel_heat_relay'}[bathroom] }}"
    speech:
      text: "Выключаю полотенцесушитель"
  FrogRoomTemperature:
    speech:
      # 23.5 is said as "23,5 градуса"; whole numbers get the right form: 21 градус, 22 градуса, 25 градусов
      text: >-
        {% set t = states({'bedroom': 'sensor.bedroom_temperature', 'hall': 'sensor.hall_temperature'}[room]) %}
        {% set where = {'bedroom': 'спальне', 'hall': 'прихожей'}[room] %}
        {% if not is_number(t) %}Не знаю, датчик в {{ where }} сейчас недоступен
        {%- else %}
        {%- set n = t | float | round(1) %}
        {%- if n == n | int %}
        {%- set i = n | int %}
        {%- set form = 'градусов' if i % 100 in [11, 12, 13, 14] else {1: 'градус', 2: 'градуса', 3: 'градуса', 4: 'градуса'}.get(i % 10, 'градусов') %}
        В {{ where }} {{ i }} {{ form }}
        {%- else %}В {{ where }} {{ n | string | replace('.', ',') }} градуса{% endif %}
        {%- endif %}
