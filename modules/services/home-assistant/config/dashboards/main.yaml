title: Home
views:
  - title: Overview
    cards:
      # Modes for the whole flat, no area
      - type: entities
        title: General actions
        entities:
          - input_boolean.day_off
          - input_boolean.vacation
          - input_boolean.tuya_mode

      - type: entities
        title: Office
        icon: mdi:chair-rolling
        entities:
          - type: section
            label: Desk
          - entity: automation.desk_schedule
            name: Schedule (paused by Day off)
          - script.desk_up
          - script.desk_down
          - type: section
            label: Printer
          - sensor.office_printer
          - sensor.office_hp_tango_black_cartridge
          - sensor.office_printer_tri_color_cartridge

      - type: entities
        title: Living room
        icon: mdi:sofa
        entities:
          - input_boolean.guests_in_living_room
          - media_player.living_room_philips_tv
          - type: buttons
            entities:
              - entity: script.tv_mode
                name: TV mode
                icon: mdi:youtube-tv
          - type: section
            label: Blinds
          - cover.living_room_blinds_left_door
          - cover.living_room_blinds_middle
          - cover.living_room_blinds_right
          - type: buttons
            entities:
              - entity: scene.living_room_blinds_full_close
                name: Full close
                icon: mdi:roller-shade-closed
              - entity: scene.living_room_blinds_open
                name: Open
                icon: mdi:roller-shade
              - entity: scene.living_room_blinds_full_open_door
                name: Open door
                icon: mdi:door-open
          - entity: automation.blinds_full_close_2_h_after_sunset
            name: Close, sunset + 2 h
          - entity: automation.blinds_full_close_at_01_00
            name: Close at 01:00
          - entity: automation.blinds_open_2_h_after_sunrise
            name: Open, sunrise + 2 h

      - type: entities
        title: Bedroom
        icon: mdi:bed
        entities:
          - cover.bedroom_curtains
          - type: buttons
            entities:
              - entity: scene.bedroom_curtains_close
                name: Close
                icon: mdi:curtains-closed
              - entity: scene.bedroom_curtains_open
                name: Open
                icon: mdi:curtains
          - entity: automation.curtains_close_at_sunset
            name: Close at sunset

      - type: entities
        title: Guest bathroom
        icon: mdi:shower
        entities:
          - climate.guest_bathroom_thermostat_guest
          - climate.guest_bathroom_towel_heat_guest
          - entity: automation.floor_warming_guest
            name: Floor warming schedule

      - type: entities
        title: Master bathroom
        icon: mdi:shower-head
        entities:
          - climate.master_bathroom_thermostat_master
          - entity: automation.floor_warming_master
            name: Floor warming schedule

      - type: entities
        title: Hall
        icon: mdi:wardrobe-outline
        entities:
          - entity: binary_sensor.huawei_igd_wan_status
            name: Internet
          - entity: sensor.huawei_igd_external_ip
            name: External IP
