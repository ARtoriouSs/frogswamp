title: Home
# Card bases used by many tabs. YAML needs an anchor above its first use, so they live above all views
card_templates:
  # The base for every on/off card: green when on, grey when off
  - &toggle
    type: custom:mushroom-template-card
    entity: input_boolean.day_off
    primary: Day off
    secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
    icon: mdi:beach
    color: "{{ 'green' if is_state(entity, 'on') else 'disabled' }}"
    vertical: true
    grid_options:
      columns: 4
      rows: 2
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  - &info
    type: custom:mushroom-template-card
    entity: binary_sensor.huawei_igd_wan_status
    primary: Internet
    secondary: "{{ 'Online · ' ~ states('sensor.huawei_igd_external_ip') if is_state(entity, 'on') else ('Offline' if is_state(entity, 'off') else 'Unavailable') }}"
    icon: mdi:web
    color: "{{ 'green' if is_state(entity, 'on') else ('red' if is_state(entity, 'off') else 'disabled') }}"
    grid_options:
      columns: 12
      rows: 1
    tap_action:
      action: more-info
  - &run
    type: custom:mushroom-template-card
    entity: script.tv_mode
    primary: TV mode
    icon: mdi:youtube-tv
    color: red
    grid_options:
      columns: 6
      rows: 1
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      target:
        entity_id: script.tv_mode
    hold_action:
      action: more-info
  - &fridge
    type: custom:mushroom-template-card
    entity: number.living_room_refrigerator_fridge_temperature
    primary: Fridge
    secondary: >-
      {{ states('sensor.living_room_refrigerator_fridge_temperature') }} °C · target {{ states(entity) }} °C
      {{- ' · door open' if is_state('binary_sensor.living_room_refrigerator_fridge_door', 'on') }}
    icon: mdi:fridge-bottom
    color: "{{ 'red' if is_state('binary_sensor.living_room_refrigerator_fridge_door', 'on') else 'light-blue' }}"
    grid_options:
      columns: 6
      rows: 2
    vertical: true
    tap_action:
      action: more-info
  - &thermostat
    type: custom:mushroom-template-card
    entity: climate.thermostat_master_local
    primary: Thermostat
    secondary: >-
      {{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else
         state_attr(entity, 'current_temperature') ~ ' °C → ' ~ state_attr(entity, 'temperature') ~ ' °C' }}
    icon: mdi:thermostat
    color: "{{ 'deep-orange' if state_attr(entity, 'hvac_action') == 'heating' else ('disabled' if states(entity) in ['off', 'unavailable', 'unknown'] else 'orange') }}"
    features_position: bottom
    features:
      - type: target-temperature
    grid_options:
      columns: 12
      rows: 2
    tap_action:
      action: more-info
  - &timed_towel_master
    type: custom:mushroom-template-card
    entity: timer.heat_towel_master
    primary: Towel 3 h
    secondary: >-
      {% set off = 'binary_sensor.heat_off_' ~ entity | replace('timer.heat_', '') %}
      {%- if is_state(entity, 'active') %}
        {%- set left = (as_datetime(state_attr(entity, 'finishes_at')) - now()).total_seconds() | int(0) %}
        {{- left // 3600 }} h {{ left % 3600 // 60 }} min left
      {%- elif states(off) in ['unavailable', 'unknown'] %}Offline
      {%- else %}Tap to start{% endif %}
    icon: "{{ 'mdi:timer-sand' if is_state(entity, 'active') else 'mdi:timer-outline' }}"
    color: "{{ 'deep-orange' if is_state(entity, 'active') else 'disabled' }}"
    vertical: true
    grid_options:
      columns: 6
      rows: 2
    tap_action:
      action: perform-action
      perform_action: script.heat_timed_press
      data:
        device: towel_master
    hold_action:
      action: more-info
  - &timed_floor_master
    <<: *timed_towel_master
    entity: timer.heat_floor_master
    primary: Floor 3 h
    grid_options:
      columns: 4
      rows: 2
    tap_action:
      action: perform-action
      perform_action: script.heat_timed_press
      data:
        device: floor_master
  - &timed_towel_master_row
    <<: *timed_towel_master
    grid_options:
      columns: 4
      rows: 2
  - &timed_floor_guest
    <<: *timed_towel_master
    entity: timer.heat_floor_guest
    primary: Floor 3 h
    grid_options:
      columns: 4
      rows: 2
    tap_action:
      action: perform-action
      perform_action: script.heat_timed_press
      data:
        device: floor_guest
  - &timed_towel_guest
    <<: *timed_towel_master
    entity: timer.heat_towel_guest
    primary: Towel 3 h
    grid_options:
      columns: 4
      rows: 2
    tap_action:
      action: perform-action
      perform_action: script.heat_timed_press
      data:
        device: towel_guest
# Views are shown by user ID (Settings → People → the user, or the auth list). Guest sees only the Guest view
views:
  # Phone remote: the Quick access buttons, big, one column even on a wide screen
  - title: Remote
    path: remote
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:remote
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
          # Remote is the first view, so it defines its own bases (anchors work only after their definition)
          - &remote
            type: custom:mushroom-template-card
            entity: script.blinds_full_close
            primary: Full close
            icon: mdi:roller-shade-closed
            color: teal
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_full_close
          - <<: *remote
            entity: script.blinds_full_close_open
            primary: Open/Reset
            icon: mdi:roller-shade
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_full_close_open
          - <<: *remote
            entity: script.blinds_balcony_toggle
            primary: Toggle balcony
            icon: mdi:door-open
            secondary: "{{ 'Wait 10 s' if is_state('timer.blinds_toggle_lock', 'active') else '' }}"
            color: "{{ 'disabled' if is_state('timer.blinds_toggle_lock', 'active') else 'teal' }}"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_balcony_toggle
          - <<: *remote
            entity: script.blinds_stop
            primary: Stop
            icon: mdi:stop
            color: red
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_stop
          - <<: *remote
            entity: script.blinds_slats_open
            primary: Blinds ↑
            icon: mdi:blinds-open
            color: cyan
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_slats_open
          - <<: *remote
            entity: script.blinds_slats_close
            primary: Blinds ↓
            icon: mdi:blinds
            color: cyan
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_slats_close

          - type: heading
            heading: Master Bedroom
            icon: mdi:bed
          - &remote_toggle
            type: custom:mushroom-template-card
            vertical: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            entity: switch.bedroom_curtains_toggle
            primary: Curtains
            secondary: "{{ 'Closed' if is_state(entity, 'on') else 'Open' }}"
            icon: "{{ 'mdi:curtains-closed' if is_state(entity, 'on') else 'mdi:curtains' }}"
            color: "{{ 'indigo' if is_state(entity, 'on') else 'amber' }}"
            grid_options:
              columns: 12
              rows: 2
          - <<: *remote_toggle
            entity: switch.master_bathroom_towel_heat_relay
            primary: Towel heat
            secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
            icon: mdi:radiator
            color: "{{ 'deep-orange' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 6
              rows: 2
          # The timed buttons: 3 h on, a tap while it runs ends it (scripts/timed_heat.yaml)
          - *timed_towel_master

  # NeonPlan 3D model of the flat. It's drawn in NeonPlan's own editor and kept in its .storage, not in the repo
  - title: NeonPlan
    path: neonplan
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:home-floor-3
    type: panel
    cards:
      - type: custom:neonplan3d-card
        fill: true

  # Weather, voice and modes. Rooms have their own tabs. Mushroom cards (HACS, www/community): tap toggles, hold opens details
  - title: Home
    path: home
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:home-heart
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home
            icon: frog:frog-face
          - type: weather-forecast
            entity: weather.forecast_home_assistant
            forecast_type: daily
          - &assist
            type: custom:mushroom-template-card
            primary: Claude RU
            icon: mdi:robot-outline
            color: purple
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: assist
              pipeline_id: 01m5zm9azpze6aa3t4z44wmh41
              start_listening: false
          - <<: *assist
            primary: Claude EN
            tap_action:
              action: assist
              pipeline_id: 01m5zme405yy9kmsr49dbazjpq
              start_listening: false

          - type: heading
            heading: Modes
            heading_style: subtitle
          - *toggle
          - <<: *toggle
            entity: input_boolean.vacation
            primary: Vacation
            icon: mdi:airplane
            tap_action:
              action: toggle
              confirmation:
                text: "Switch Vacation mode?"
          - <<: *toggle
            entity: input_boolean.tuya_mode
            primary: Tuya rules
            icon: mdi:cellphone-cog
            tap_action:
              action: toggle
              confirmation:
                text: "Switch Tuya rule mode? HA automations that move Tuya devices stop while it is on"

  # Room temperatures and heating per bathroom. Humidity and fans go here later
  - title: Climate
    path: climate
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:thermometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Temperature
            icon: mdi:thermometer
          # Blue under 18 °C, green up to 24 °C, orange above
          - &temperature
            type: custom:mushroom-template-card
            entity: sensor.home_temperature
            primary: Home
            secondary: "{{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else states(entity) ~ ' °C · average of the rooms' }}"
            icon: mdi:home-thermometer
            color: >-
              {% set value = states(entity) | float(none) %}
              {{ 'disabled' if value is none else ('blue' if value < 18 else ('green' if value <= 24 else 'orange')) }}
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          - &room_temperature
            <<: *temperature
            entity: sensor.bedroom_temperature
            primary: Bedroom
            secondary: "{{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else states(entity) ~ ' °C' }}"
            icon: mdi:bed
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: more-info
          - <<: *room_temperature
            entity: sensor.hall_temperature
            primary: Hall
            icon: mdi:wardrobe-outline
          - <<: *room_temperature
            entity: sensor.guest_bathroom_temperature
            primary: Guest bath
            icon: mdi:shower
          - <<: *room_temperature
            entity: sensor.garage_audi_a5_sportback_outside_temperature
            primary: Car
            icon: mdi:car
            color: light-blue
            grid_options:
              columns: 6
              rows: 2
          - <<: *room_temperature
            entity: weather.forecast_home_assistant
            primary: Outside
            secondary: "{{ state_attr(entity, 'temperature') }} °C"
            icon: mdi:weather-partly-cloudy
            color: light-blue
            grid_options:
              columns: 6
              rows: 2
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.home_temperature
                name: Home
              - entity: sensor.bedroom_temperature
                name: Bedroom
              - entity: sensor.hall_temperature
                name: Hall
              - entity: sensor.guest_bathroom_temperature
                name: Guest bath
              - entity: sensor.garage_audi_a5_sportback_outside_temperature
                name: Car
            grid_options:
              columns: full

          - type: heading
            heading: Weather
            heading_style: subtitle
          - type: weather-forecast
            entity: weather.forecast_home_assistant
            forecast_type: daily
            grid_options:
              columns: full
          - type: weather-forecast
            entity: weather.forecast_home_assistant
            forecast_type: hourly
            show_current: false
            grid_options:
              columns: full
          # next_rising and next_setting jump to tomorrow once the sun has risen or set
          - &sun
            type: custom:mushroom-template-card
            entity: sun.sun
            primary: Sunrise
            secondary: >-
              {% set time = as_local(as_datetime(state_attr(entity, 'next_rising'))) %}
              {{ time.strftime('%H:%M') }}{{ ' tomorrow' if time.date() != now().date() }}
            icon: mdi:weather-sunset-up
            color: amber
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - <<: *sun
            primary: Sunset
            secondary: >-
              {% set time = as_local(as_datetime(state_attr(entity, 'next_setting'))) %}
              {{ time.strftime('%H:%M') }}{{ ' tomorrow' if time.date() != now().date() }}
            icon: mdi:weather-sunset-down
            color: deep-orange

          - type: heading
            heading: Air · GIOŚ Grochowska
            heading_style: subtitle
          # Colours follow the GIOŚ index, from very good (green) to very bad (brown)
          - &air_quality
            type: custom:mushroom-template-card
            entity: sensor.air_quality_air_quality_index
            primary: Air quality
            secondary: "{{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else states(entity) | replace('_', ' ') | capitalize }}"
            icon: mdi:air-filter
            color: >-
              {{ {'very_good': 'green', 'good': 'light-green', 'moderate': 'yellow', 'sufficient': 'orange', 'bad': 'red', 'very_bad': 'brown'}
                 .get(states(entity), 'disabled') }}
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          # Each pollutant has its own index sensor with the same name and _index at the end
          - &pollutant
            type: custom:mushroom-template-card
            entity: sensor.air_quality_pm2_5
            primary: PM2.5
            secondary: "{{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else states(entity) ~ ' µg/m³' }}"
            icon: mdi:blur
            color: >-
              {{ {'very_good': 'green', 'good': 'light-green', 'moderate': 'yellow', 'sufficient': 'orange', 'bad': 'red', 'very_bad': 'brown'}
                 .get(states(entity ~ '_index'), 'disabled') }}
            vertical: true
            grid_options:
              columns: 4
              rows: 2
            tap_action:
              action: more-info
          - <<: *pollutant
            entity: sensor.air_quality_pm10
            primary: PM10
            icon: mdi:blur-radial
          - <<: *pollutant
            entity: sensor.air_quality_nitrogen_dioxide
            primary: NO₂
            icon: mdi:car-side

      - type: grid
        cards:
          - type: heading
            heading: Master bathroom
            icon: mdi:shower-head
          - *thermostat
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: climate.thermostat_master_local
                name: Thermostat
            grid_options:
              columns: full
          - <<: *toggle
            entity: switch.master_floor_warming
            primary: Floor warming
            icon: mdi:heating-coil
            color: "{{ 'deep-orange' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 2
          - <<: *toggle
            entity: automation.floor_warming_master_schedule
            primary: Floor schedule
            icon: mdi:calendar-clock
            grid_options:
              columns: 4
              rows: 2
          - *timed_floor_master
          - <<: *toggle
            entity: switch.master_bathroom_towel_heat_relay
            primary: Towel heat
            icon: mdi:radiator
            color: "{{ 'deep-orange' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 2
          - <<: *toggle
            entity: automation.towel_heat_master_schedule
            primary: Towel schedule
            icon: mdi:calendar-clock
            grid_options:
              columns: 4
              rows: 2
          - *timed_towel_master_row

          # empty heading: a gap before the next room
          - type: heading
            heading: ""
          - type: heading
            heading: Living room
            icon: mdi:sofa
          - *fridge
          - <<: *fridge
            entity: number.living_room_refrigerator_freezer_temperature
            primary: Freezer
            secondary: >-
              {{ states('sensor.living_room_refrigerator_freezer_temperature') }} °C · target {{ states(entity) }} °C
              {{- ' · door open' if is_state('binary_sensor.living_room_refrigerator_freezer_door', 'on') }}
            icon: mdi:fridge-top
            color: "{{ 'red' if is_state('binary_sensor.living_room_refrigerator_freezer_door', 'on') else 'blue' }}"

      - type: grid
        cards:
          - type: heading
            heading: Guest bathroom
            icon: mdi:shower
          - <<: *thermostat
            entity: climate.thermostat_guest_local
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: climate.thermostat_guest_local
                name: Thermostat
            grid_options:
              columns: full
          - <<: *toggle
            entity: switch.guest_floor_warming
            primary: Floor warming
            icon: mdi:heating-coil
            color: "{{ 'deep-orange' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 2
          - <<: *toggle
            entity: automation.floor_warming_guest_schedule
            primary: Floor schedule
            icon: mdi:calendar-clock
            grid_options:
              columns: 4
              rows: 2
          - *timed_floor_guest
          - <<: *thermostat
            entity: climate.guest_bathroom_towel_heat_guest
            primary: Towel heat
            icon: mdi:radiator
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            grid_options:
              columns: 8
              rows: 2
          - *timed_towel_guest

  # Lights and players. The Cube Matrix is the only smart light for now
  - title: Light & media
    path: light-media
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Office · Cube Matrix
            icon: mdi:cube-outline
          - type: custom:mushroom-template-card
            entity: light.cube_matrix_192_168_101_121
            primary: Cube Matrix
            secondary: "{{ [1, (state_attr(entity, 'brightness') / 2.55) | round] | max ~ ' %' if is_state(entity, 'on') else 'Off' }}"
            icon: mdi:cube-outline
            color: "{{ 'green' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 9
              rows: 2
            features_position: bottom
            features:
              - type: light-brightness
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - <<: *toggle
            entity: switch.cube_bright
            primary: Bright
            secondary: ""
            icon: mdi:brightness-7
            color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
            grid_options:
              columns: 3
              rows: 2
          - type: custom:mushroom-template-card
            entity: select.cube_matrix_192_168_101_121_background
            primary: Background
            secondary: "{{ states(entity) }}"
            icon: mdi:image-filter-hdr
            color: green
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 12
              rows: 2
            tap_action:
              action: more-info
          - <<: *run
            entity: script.cube_wake
            primary: Frogs
            icon: frog:frog-face
            color: green
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.cube_wake
          - <<: *run
            entity: script.cube_sleep
            primary: Green dot
            icon: mdi:circle-small
            color: green
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.cube_sleep

          - type: heading
            heading: Automations
            heading_style: subtitle
          # Set by the night automation, not by hand
          - <<: *toggle
            entity: input_boolean.cube_night
            primary: Night mode
            secondary: "{{ 'On, from bedtime to wakeup' if is_state(entity, 'on') else 'Off' }}"
            icon: mdi:weather-night
            color: "{{ 'indigo' if is_state(entity, 'on') else 'disabled' }}"
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          - &cube_automation
            <<: *toggle
            entity: automation.cube_another_frog_every_hour
            primary: Frog every hour
            icon: frog:frog-face
            vertical: false
            grid_options:
              columns: 6
              rows: 1
          - <<: *cube_automation
            entity: automation.cube_next_frog_on_button_tap
            primary: Frog on button
            icon: mdi:gesture-tap-button
          - <<: *cube_automation
            entity: automation.cube_animations_for_desk_blinds_and_modes
            primary: Animations
            icon: mdi:animation-play
          - <<: *cube_automation
            entity: automation.cube_coffee_at_work_start_moon_at_work_end
            primary: Coffee and moon
            icon: mdi:coffee
          - <<: *cube_automation
            entity: automation.cube_green_dot_at_night_and_on_vacation
            primary: Night green dot
            icon: mdi:weather-night
          - <<: *cube_automation
            entity: automation.cube_play_sign_when_the_tv_starts_casting
            primary: TV cast sign
            icon: mdi:cast
          - <<: *cube_automation
            entity: automation.cube_integration_and_server_problems
            primary: Problem alerts
            icon: mdi:alert-outline

      - type: grid
        cards:
          - type: heading
            heading: Living room · TV
            icon: mdi:television
          - &player
            type: custom:mushroom-media-player-card
            entity: media_player.living_room_philips_tv
            name: TV
            icon: mdi:television
            use_media_info: true
            show_volume_level: true
            collapsible_controls: false
            media_controls:
              - on_off
              - previous
              - play_pause_stop
              - next
            volume_controls:
              - volume_mute
              - volume_buttons
            grid_options:
              columns: 12
            tap_action:
              action: more-info
          - <<: *run
            entity: script.tv_mode
            primary: TV mode
            icon: mdi:youtube-tv
            color: red
            grid_options:
              columns: 12
              rows: 1
            tap_action:
