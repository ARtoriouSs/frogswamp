  - title: Overview
    path: overview
    # Each section is one column on a wide screen, on a phone they go one under another
    type: sections
    max_columns: 3
    # No title toggles on the cards: one tap there switches every row of the card at once
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home_assistant
            forecast_type: daily

          # Opens the Assist dialog with a pipeline that talks to conversation.claude
          - type: button
            name: Claude RU
            icon: mdi:robot-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: assist
              pipeline_id: 01m5zm9azpze6aa3t4z44wmh41
              start_listening: false
          - type: button
            name: Claude EN
            icon: mdi:robot-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: assist
              pipeline_id: 01m5zme405yy9kmsr49dbazjpq
              start_listening: false

          # Modes for the whole flat, no area
          - type: entities
            title: General actions
            show_header_toggle: false
            entities:
              - input_boolean.day_off
              - input_boolean.vacation
              - input_boolean.tuya_mode

          # Shortcuts to the room cards' buttons, so they are near the top on a phone
