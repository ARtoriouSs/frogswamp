              action: assist
              pipeline_id: 01m5zme405yy9kmsr49dbazjpq
              start_listening: false

  # Mushroom cards. The times are set in packages/schedule.yaml: a change made here is reset on the next HA restart
  - title: Schedule
    path: schedule
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:calendar-clock
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Today
            icon: mdi:calendar-today
          - type: custom:mushroom-template-card
            entity: binary_sensor.workday_sensor_pl
            primary: "{{ 'Workday' if is_state(entity, 'on') else 'No work today' }}"
            secondary: "{{ now().strftime('%A, %d.%m') }}"
            icon: "{{ 'mdi:briefcase' if is_state(entity, 'on') else 'mdi:beach' }}"
            color: "{{ 'blue' if is_state(entity, 'on') else 'green' }}"
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          - &sched_toggle
            type: custom:mushroom-template-card
            entity: input_boolean.day_off
            primary: Day off
            secondary: "{{ 'On' if is_state(entity, 'on') else 'Off' }}"
            icon: mdi:beach
            color: "{{ 'green' if is_state(entity, 'on') else 'disabled' }}"
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - <<: *sched_toggle
            entity: input_boolean.vacation
            primary: Vacation
            icon: mdi:airplane
            tap_action:
              action: toggle
              confirmation:
                text: "Switch Vacation mode?"

      - type: grid
        cards:
          - type: heading
            heading: Wakeup
            icon: mdi:weather-sunset-up
          - type: custom:mushroom-template-card
            entity: sensor.wakeup
            primary: Next wakeup
            secondary: >-
              {% set t = as_timestamp(states(entity), none) %}
              {{ t | timestamp_custom('%a %d.%m, %H:%M') if t else 'Unknown' }}
            icon: mdi:weather-sunset-up
            color: amber
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          # input_datetime holds "07:30:00": the card shows hours and minutes
          - &time
            type: custom:mushroom-template-card
            entity: input_datetime.wakeup_workday
            primary: "{{ states(entity)[:5] }}"
            secondary: Workday fallback
            icon: mdi:briefcase-outline
            color: amber
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            tap_action:
              action: more-info
          - <<: *time
            entity: input_datetime.wakeup_weekend
            secondary: Weekend or holiday fallback
            icon: mdi:beach
          - type: custom:mushroom-template-card
            entity: sensor.pixel_7_next_alarm
            primary: Next phone alarm
            secondary: >-
              {% set t = as_timestamp(states(entity), none) %}
              {{ t | timestamp_custom('%a %d.%m, %H:%M') if t else 'None set' }}
            icon: mdi:alarm
            color: "{{ 'amber' if as_timestamp(states(entity), none) else 'disabled' }}"
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          - type: heading
            heading: ""
          - type: heading
            heading: Bedtime
            icon: mdi:sleep
          - <<: *time
            entity: input_datetime.bedtime_workday
            secondary: Before a workday
            icon: mdi:briefcase-outline
            color: indigo
          - <<: *time
            entity: input_datetime.bedtime_weekend
            secondary: Before a weekend day or holiday
            icon: mdi:beach
            color: indigo
          - type: heading
            heading: ""
          - type: heading
            heading: Work
            icon: mdi:laptop
          - <<: *time
            entity: input_datetime.work_start
            secondary: Start
            icon: mdi:play
            color: blue
          - <<: *time
            entity: input_datetime.work_end
            secondary: End
            icon: mdi:stop
            color: blue

      - type: grid
        cards:
          - type: heading
            heading: Workdays
            icon: mdi:calendar-month
          # Workday's calendar has an event on each workday, so a weekday without one is a holiday
          - type: calendar
            initial_view: dayGridMonth
            entities:
              - calendar.workday_sensor_pl_calendar

  # Range, timelines (two columns wide) and the % per device (sensors in packages/uptime.yaml)
  - title: Monitor
    path: monitor
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:lan-connect
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Range
            icon: mdi:calendar-range
          - type: custom:mushroom-template-card
            entity: input_select.uptime_range
            primary: Day
            icon: mdi:calendar-today
            color: "{{ 'primary' if is_state(entity, 'Day') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.uptime_range
              data:
                option: Day
          - type: custom:mushroom-template-card
            entity: input_select.uptime_range
            primary: Week
            icon: mdi:calendar-week
            color: "{{ 'primary' if is_state(entity, 'Week') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.uptime_range
              data:
                option: Week
          - type: custom:mushroom-template-card
            entity: input_select.uptime_range
            primary: Month
            icon: mdi:calendar-month
            color: "{{ 'primary' if is_state(entity, 'Month') else 'disabled' }}"
            grid_options:
              columns: 4
              rows: 1
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.uptime_range
              data:
                option: Month
          # empty heading: a gap before the next block
          - type: heading
            heading: ""
          - type: heading
            heading: Printer
            heading_style: subtitle
          - &ink
            type: custom:mushroom-template-card
            entity: sensor.office_printer
            primary: Printer
            secondary: "{{ states(entity) | capitalize }}"
            icon: mdi:printer
            color: "{{ 'disabled' if states(entity) in ['unavailable', 'off', 'unknown'] else 'green' }}"
            grid_options:
              columns: 4
              rows: 2
            vertical: true
            tap_action:
              action: more-info
          - &printer_black
            <<: *ink
            entity: sensor.office_hp_tango_black_cartridge
            primary: Black
            secondary: "{{ states(entity) }} %"
            icon: mdi:water
            color: "{{ 'red' if states(entity) | int(100) < 15 else 'grey' }}"
          - &printer_colour
            <<: *ink
            entity: sensor.office_printer_tri_color_cartridge
            primary: Colour
            secondary: "{{ states(entity) }} %"
            icon: mdi:palette
            color: "{{ 'red' if states(entity) | int(100) < 15 else 'pink' }}"
          # empty heading: a gap before the next block
          - type: heading
            heading: ""
          - type: heading
            heading: Hall
            icon: mdi:wardrobe-outline
          - *info
          - &hall_router
            <<: *info
            entity: sensor.hall_router_donwload_speed
            primary: Router
            # KiB/s from the router: whole numbers from 10, MiB/s from 1024
            secondary: >-
              {% macro speed(id) %}{% set v = states(id) | float(0) %}
              {{- (v / 1024) | round(1) ~ ' MiB/s' if v >= 1024 else (v | round(0) | int if v >= 10 else v | round(1)) ~ ' KiB/s' }}{% endmacro %}
              {{ 'Unavailable' if states(entity) in ['unavailable', 'unknown'] else
                 '↓ ' ~ speed(entity) ~ ' · ↑ ' ~ speed('sensor.hall_router_upload_speed') }}
            icon: mdi:router-wireless
            color: "{{ 'disabled' if states(entity) in ['unavailable', 'unknown'] else 'blue' }}"
          # A tap runs a test (~30 s), a hold shows the history
          - &hall_speedtest
            <<: *info
            entity: script.speedtest_run
            primary: Speed test
            secondary: >-
              {% if is_state(entity, 'on') %}Testing…
              {%- elif has_value('sensor.speedtest_download') %}↓ {{ states('sensor.speedtest_download') }} · ↑ {{ states('sensor.speedtest_upload') }} Mbit/s · {{ states('sensor.speedtest_ping') }} ms · {{ relative_time(states.sensor.speedtest_download.last_changed) }} ago
              {%- else %}Tap to test{% endif %}
            icon: mdi:speedometer
            color: "{{ 'amber' if is_state(entity, 'on') else 'purple' }}"
            tap_action:
              action: perform-action
              perform_action: script.speedtest_run
            hold_action:
              action: more-info
              entity: sensor.speedtest_download
          - &hall_qbittorrent
            <<: *info
            entity: sensor.qbittorrent_status
            primary: qBittorrent
            secondary: >-
              ↓ {{ states('sensor.qbittorrent_download_speed') }} {{ state_attr('sensor.qbittorrent_download_speed', 'unit_of_measurement') }}
              · {{ states('sensor.qbittorrent_active_torrents') }} active
            icon: mdi:download
            color: "{{ 'disabled' if states(entity) in ['unavailable', 'unknown'] else 'teal' }}"
            grid_options:
              columns: 6
              rows: 1
          - &hall_slow_downloads
            <<: *toggle
            entity: switch.qbittorrent_alternative_speed
            primary: Slow downloads
            icon: mdi:speedometer-slow
            vertical: false
            grid_options:
              columns: 6
              rows: 1
          - &hall_zigbee_pairing
            <<: *toggle
            entity: switch.zigbee2mqtt_bridge_permit_join
            primary: Zigbee pairing
            icon: mdi:zigbee
            color: "{{ 'amber' if is_state(entity, 'on') else 'disabled' }}"
            vertical: false
            grid_options:
              columns: 6
              rows: 1
          - &hall_restart_bridge
            type: custom:mushroom-template-card
            entity: button.zigbee2mqtt_bridge_restart
            primary: Restart bridge
            secondary: Hold to restart
            icon: mdi:restart
            color: grey
            grid_options:
              columns: 6
              rows: 1
            tap_action:
