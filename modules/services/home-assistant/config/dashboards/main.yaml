      - type: entities
        title: Schedule
        show_header_toggle: false
        icon: mdi:calendar-clock
        entities:
          - entity: binary_sensor.workday_sensor_pl
            name: Today is a workday
          - entity: input_boolean.day_off
          - entity: input_boolean.vacation
          - entity: sensor.pixel_7_next_alarm
            name: Next phone alarm
            format: datetime
          - type: section
            label: Wakeup
          - type: simple-entity
            entity: input_datetime.wakeup_workday
            name: Workday
          - type: simple-entity
            entity: input_datetime.wakeup_weekend
            name: Weekend or holiday
          - type: section
            label: Bedtime
          - type: simple-entity
            entity: input_datetime.bedtime_workday
            name: Before a workday
          - type: simple-entity
            entity: input_datetime.bedtime_weekend
            name: Before a weekend day or holiday
          - type: section
            label: Work
          - type: simple-entity
            entity: input_datetime.work_start
            name: Start
          - type: simple-entity
            entity: input_datetime.work_end
            name: End

      - type: calendar
        # Workday's calendar has an event on each workday, so a weekday without one is a holiday
        title: Workdays
        initial_view: dayGridMonth
        entities:
          - calendar.workday_sensor_pl_calendar

  - title: Uptime (old)
    path: uptime
    icon: mdi:lan-connect
    # Sections, not masonry: masonry puts a short card and the next one in the same column.
    # Each section is a column: the range, the timelines and the uptime %. Rooms in the same order in both
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: Range
            show_header_toggle: false
            icon: mdi:calendar-range
            entities:
              - entity: input_select.uptime_range
                name: Showing
              - type: buttons
                entities:
                  - entity: input_select.uptime_range
                    name: Day
                    icon: mdi:calendar-today
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Day
                  - entity: input_select.uptime_range
                    name: Week
                    icon: mdi:calendar-week
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Week
                  - entity: input_select.uptime_range
                    name: Month
                    icon: mdi:calendar-month
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Month

