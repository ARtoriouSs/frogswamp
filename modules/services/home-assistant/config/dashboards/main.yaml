  # The same cards as the built-in Energy page. Devices are set up there (Settings → Dashboards → Energy),
  # for now only the fridge
  - title: Energy
    path: energy
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Fridge
            icon: mdi:fridge
          - type: energy-date-selection
            grid_options:
              columns: full
          - type: energy-devices-detail-graph
            grid_options:
              columns: full
          - type: energy-devices-graph
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Power now
            icon: mdi:flash
          - type: custom:mushroom-template-card
            entity: sensor.living_room_refrigerator_power
            primary: Fridge
            secondary: "{{ states(entity) }} W · {{ states('sensor.living_room_refrigerator_energy') | float(0) | round(1) }} kWh total"
            icon: mdi:fridge
            color: amber
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: more-info
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.living_room_refrigerator_power
                name: Fridge
            grid_options:
              columns: full

  # One tab per room. Printer and Hall cards are defined in Monitor and shown there too
  - title: Living room
    path: living-room
    visible:
      - user: 276c6c52cb474dd9bdf6dac5ca4fad31 # Aleksander
      - user: 06ec04272df9426db1d4322dfc5bda92 # Natallia
    icon: mdi:sofa
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
          - <<: *toggle
            entity: input_boolean.guests_in_living_room
            primary: Guests
            icon: mdi:account-multiple
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: toggle
              confirmation:
                text: "Switch Guests mode?"
          - type: custom:mushroom-template-card
            entity: media_player.living_room_philips_tv
            primary: TV
            secondary: "{{ state_attr(entity, 'media_title') or states(entity) | capitalize }}"
            icon: mdi:television
            color: "{{ 'blue' if is_state(entity, 'on') or is_state(entity, 'playing') else 'disabled' }}"
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: more-info
          - *run

          - type: heading
            heading: Fridge
            heading_style: subtitle
          # Tap opens the target, so it can be changed
          - *fridge
          - <<: *fridge
            entity: number.living_room_refrigerator_freezer_temperature
            primary: Freezer
            secondary: >-
              {{ states('sensor.living_room_refrigerator_freezer_temperature') }} °C · target {{ states(entity) }} °C
              {{- ' · door open' if is_state('binary_sensor.living_room_refrigerator_freezer_door', 'on') }}
            icon: mdi:fridge-top
            color: "{{ 'red' if is_state('binary_sensor.living_room_refrigerator_freezer_door', 'on') else 'blue' }}"
          - <<: *toggle
            entity: switch.living_room_refrigerator_cubed_ice
            primary: Ice cubes
            icon: mdi:cube-outline
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: toggle
              confirmation:
                text: "Switch ice cubes?"

      - type: grid
        cards:
          - type: heading
            heading: Blinds
            heading_style: subtitle
          - &cover
            type: custom:mushroom-template-card
            entity: cover.blinds_left_door_local
            primary: Left (door)
            # Tuya Local only knows open and closed at the end positions, in between it is unknown:
            # shown as half-open and counted as open
            secondary: >-
              {{ 'Half-open' if is_state(entity, 'unknown') else states(entity) | capitalize }}{{ ' · ' ~ state_attr(entity, 'current_position') ~ ' %' if state_attr(entity, 'current_position') is not none }}
            icon: mdi:blinds
            color: "{{ 'amber' if states(entity) in ['open', 'unknown'] else 'disabled' }}"
            features_position: inline
            features:
              - type: cover-open-close
            tap_action:
              action: more-info
          - <<: *cover
            entity: cover.blinds_middle_local
            primary: Middle
          - <<: *cover
            entity: cover.blinds_right_local
            primary: Right
          - &scene
            type: custom:mushroom-template-card
            entity: script.blinds_full_close
            primary: Full close
            icon: mdi:roller-shade-closed
            color: teal
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_full_close
          - <<: *scene
            entity: script.blinds_full_close_open
            primary: Open/Reset
            icon: mdi:roller-shade
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.blinds_full_close_open
          - <<: *scene
            entity: script.blinds_balcony_toggle
            primary: Toggle balcony
            icon: mdi:door-open
            secondary: "{{ 'Wait 10 s' if is_state('timer.blinds_toggle_lock', 'active') else '' }}"
            color: "{{ 'disabled' if is_state('timer.blinds_toggle_lock', 'active') else 'teal' }}"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
