title: Home
views:
  - title: Overview
    # Each section is one column on a wide screen, on a phone they go one under another
    type: sections
    max_columns: 3
    # No title toggles on the cards: one tap there switches every row of the card at once
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home_assistant
            forecast_type: daily

          # Opens the Assist dialog with a pipeline that talks to conversation.claude
          - type: button
            name: Claude RU
            icon: mdi:robot-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: assist
              pipeline_id: 01m5zm9azpze6aa3t4z44wmh41
              start_listening: false
          - type: button
            name: Claude EN
            icon: mdi:robot-outline
            show_state: false
            grid_options:
              columns: 6
              rows: 1
            tap_action:
              action: assist
              pipeline_id: 01m5zme405yy9kmsr49dbazjpq
              start_listening: false

          # Modes for the whole flat, no area
          - type: entities
            title: General actions
            show_header_toggle: false
            entities:
              - input_boolean.day_off
              - input_boolean.vacation
              - input_boolean.tuya_mode

          # Shortcuts to the room cards' buttons, so they are near the top on a phone
          - type: entities
            title: Quick access
            show_header_toggle: false
            entities:
              - type: section
                label: Living room
              - type: buttons
                entities:
                  - entity: scene.living_room_blinds_full_close
                    name: Full close
                    icon: mdi:roller-shade-closed
                  - entity: scene.living_room_blinds_open
                    name: Open
                    icon: mdi:roller-shade
              - type: buttons
                entities:
                  - entity: scene.living_room_blinds_full_close_open
                    name: Full close + open
                    icon: mdi:roller-shade
                  - entity: scene.living_room_blinds_full_open_door
                    name: Open door
                    icon: mdi:door-open
              - type: buttons
                entities: &blinds_up_down
                  - entity: scene.blinds
                    name: Blinds ^
                    icon: mdi:blinds-open
                  - entity: scene.blinds_v
                    name: Blinds v
                    icon: mdi:blinds
              - type: section
                label: Bedroom
              - entity: switch.bedroom_curtains_toggle
                name: Curtains closed
              - type: section
                label: Master bathroom
              - entity: switch.master_bathroom_towel_heat_relay
                name: Towel heat

      - type: grid
        cards:
          - type: entities
            title: Living room
            show_header_toggle: false
            icon: mdi:sofa
            entities:
              - input_boolean.guests_in_living_room
              - media_player.living_room_philips_tv
              - type: buttons
                entities:
                  - entity: script.tv_mode
                    name: TV mode
                    icon: mdi:youtube-tv
              - type: section
                label: Fridge
              - entity: sensor.living_room_refrigerator_fridge_temperature
                name: Fridge
              - entity: number.living_room_refrigerator_fridge_temperature
                name: Fridge target
              - entity: sensor.living_room_refrigerator_freezer_temperature
                name: Freezer
              - entity: number.living_room_refrigerator_freezer_temperature
                name: Freezer target
              - entity: binary_sensor.living_room_refrigerator_fridge_door
                name: Fridge door
              - entity: binary_sensor.living_room_refrigerator_freezer_door
                name: Freezer door
              - entity: switch.living_room_refrigerator_cubed_ice
                name: Ice cubes
              - type: section
                label: Blinds
              - cover.living_room_blinds_left_door
              - cover.living_room_blinds_middle
              - cover.living_room_blinds_right
              - type: buttons
                entities:
                  - entity: scene.living_room_blinds_full_close
                    name: Full close
                    icon: mdi:roller-shade-closed
                  - entity: scene.living_room_blinds_open
                    name: Open
                    icon: mdi:roller-shade
                  - entity: scene.living_room_blinds_full_close_open
                    name: Full close + open
                    icon: mdi:roller-shade
                  - entity: scene.living_room_blinds_full_open_door
                    name: Open door
                    icon: mdi:door-open
              - type: buttons
                entities: *blinds_up_down
              - entity: automation.blinds_full_close_2_h_after_sunset
                name: Close, sunset + 2 h
              - entity: automation.blinds_full_close_at_01_00
                name: Close at 01:00
              - entity: automation.blinds_open_2_h_after_sunrise
                name: Open, sunrise + 2 h

          - type: entities
            title: Office
            show_header_toggle: false
            icon: mdi:chair-rolling
            entities:
              - type: section
                label: Desk
              - entity: automation.desk_schedule
                name: Schedule (paused by Day off)
              - script.desk_up
              - script.desk_down
              - type: section
                label: Cube Matrix
              - entity: select.cube_matrix_192_168_101_121_background
                name: Background
              - entity: automation.cube_another_frog_every_hour
                name: Another frog every hour
              - entity: automation.cube_animations_for_desk_blinds_and_modes
                name: Animations for desk, blinds and modes
              - type: section
                label: Printer
              - sensor.office_printer
              - sensor.office_hp_tango_black_cartridge
              - sensor.office_printer_tri_color_cartridge

          # Entities rows have no brightness slider, so the cube's light is a tile under the Office card
          - type: tile
            entity: light.cube_matrix_192_168_101_121
            name: Cube Matrix
            grid_options:
              columns: 9
              rows: 2
            features_position: bottom
            features:
              - type: light-brightness
          # 0% / 100% in one tap, next to the slider
          - type: tile
            entity: switch.cube_bright
            name: Bright
            vertical: true
            hide_state: true
            grid_options:
              columns: 3
              rows: 2
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          - type: entities
            title: Bedroom
            show_header_toggle: false
            icon: mdi:bed
            entities:
              - cover.bedroom_curtains
              - type: buttons
                entities:
                  - entity: scene.bedroom_curtains_close
                    name: Close
                    icon: mdi:curtains-closed
                  - entity: scene.bedroom_curtains_open
                    name: Open
                    icon: mdi:curtains
              - entity: automation.curtains_close_at_sunset
                name: Close at sunset

          - type: entities
            title: Master bathroom
            show_header_toggle: false
            icon: mdi:shower-head
            entities:
              - climate.master_bathroom_thermostat_master
              - entity: switch.master_floor_warming
                name: Floor warming
              - entity: automation.floor_warming_master_schedule
                name: Floor warming schedule
              - entity: switch.master_bathroom_towel_heat_relay
                name: Towel heat
              - entity: automation.towel_heat_master_schedule
                name: Towel heat schedule

          - type: entities
            title: Guest bathroom
            show_header_toggle: false
            icon: mdi:shower
            entities:
              - climate.guest_bathroom_thermostat_guest
              - entity: switch.guest_floor_warming
                name: Floor warming
              - entity: automation.floor_warming_guest_schedule
                name: Floor warming schedule
              - climate.guest_bathroom_towel_heat_guest
              - entity: switch.guest_towel_heat
                name: Towel heat

      - type: grid
        cards:
          - type: entities
            title: Hall
            show_header_toggle: false
            icon: mdi:wardrobe-outline
            entities:
              - type: section
                label: Router
              - entity: binary_sensor.huawei_igd_wan_status
                name: Internet
              - entity: sensor.huawei_igd_external_ip
                name: External IP
              - entity: sensor.hall_router_donwload_speed
                name: Download speed
              - entity: sensor.hall_router_upload_speed
                name: Upload speed
              - type: section
                label: Zigbee
              - entity: switch.zigbee2mqtt_bridge_permit_join
                name: Allow new devices to join
              - entity: button.zigbee2mqtt_bridge_restart
                name: Restart the bridge
              - type: section
                label: Downloads
              - entity: sensor.qbittorrent_status
                name: qBittorrent
              - entity: sensor.qbittorrent_download_speed
                name: Download speed
              - entity: sensor.qbittorrent_upload_speed
                name: Upload speed
              - entity: sensor.qbittorrent_active_torrents
                name: Active torrents
              - entity: switch.qbittorrent_alternative_speed
                name: Slow mode
              - type: section
                label: Health
              - entity: sensor.backup_last_successful_automatic_backup
                name: Last backup
              - entity: sensor.failed_integrations
                name: Failed HA integrations

          - type: entities
            title: Garage
            show_header_toggle: false
            icon: mdi:car
            entities:
              - entity: sensor.garage_audi_a5_sportback_outside_temperature
                name: Outside temperature
              - entity: sensor.garage_audi_a5_sportback_range
                name: Range
              - entity: sensor.garage_audi_a5_sportback_fuel_level
                name: Fuel
              - entity: binary_sensor.garage_audi_a5_sportback_doors_locked
                name: Locked
              - entity: binary_sensor.garage_audi_a5_sportback_doors_open
                name: Doors
              - entity: binary_sensor.garage_audi_a5_sportback_windows_open
                name: Windows
              - entity: binary_sensor.garage_audi_a5_sportback_trunk_open
                name: Trunk
              - entity: sensor.garage_audi_a5_sportback_next_service
                name: Next service
              - entity: sensor.garage_audi_a5_sportback_odometer
                name: Odometer
              - entity: button.garage_audi_a5_sportback_refresh_data
                name: Refresh data

  - title: Schedule
    path: schedule
    icon: mdi:calendar-clock
    cards:
      # Shown read-only: a change in the UI is reset on the next HA restart, change packages/schedule.yaml
      - type: entities
        title: Schedule
        show_header_toggle: false
        icon: mdi:calendar-clock
        entities:
          - entity: binary_sensor.workday_sensor_pl
            name: Today is a workday
          - entity: input_boolean.day_off
          - entity: input_boolean.vacation
          - entity: sensor.pixel_7_next_alarm
            name: Next phone alarm
            format: datetime
          - type: section
            label: Wakeup
          - type: simple-entity
            entity: input_datetime.wakeup_workday
            name: Workday
          - type: simple-entity
            entity: input_datetime.wakeup_weekend
            name: Weekend or holiday
          - type: section
            label: Bedtime
          - type: simple-entity
            entity: input_datetime.bedtime_workday
            name: Before a workday
          - type: simple-entity
            entity: input_datetime.bedtime_weekend
            name: Before a weekend day or holiday
          - type: section
            label: Work
          - type: simple-entity
            entity: input_datetime.work_start
            name: Start
          - type: simple-entity
            entity: input_datetime.work_end
            name: End

      - type: calendar
        # Workday's calendar has an event on each workday, so a weekday without one is a holiday
        title: Workdays
        initial_view: dayGridMonth
        entities:
          - calendar.workday_sensor_pl_calendar

  - title: Uptime
    path: uptime
    icon: mdi:lan-connect
    # Sections, not masonry: masonry puts a short card and the next one in the same column.
    # Each section is a column: the range, the timelines and the uptime %. Rooms in the same order in both
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: Range
            show_header_toggle: false
            icon: mdi:calendar-range
            entities:
              - entity: input_select.uptime_range
                name: Showing
              - type: buttons
                entities:
                  - entity: input_select.uptime_range
                    name: Day
                    icon: mdi:calendar-today
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Day
                  - entity: input_select.uptime_range
                    name: Week
                    icon: mdi:calendar-week
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Week
                  - entity: input_select.uptime_range
                    name: Month
                    icon: mdi:calendar-month
                    tap_action:
                      action: perform-action
                      perform_action: input_select.select_option
                      target:
                        entity_id: input_select.uptime_range
                      data:
                        option: Month


      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.uptime_range
                state: Day
            card:
              type: history-graph
              title: Living room
              hours_to_show: 24
              entities:
                - entity: binary_sensor.blinds_right_online
                  name: "Blinds right\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u200A\u200A\u200A"
                - entity: binary_sensor.blinds_middle_online
                  name: "Blinds middle\u00A0\u00A0\u00A0\u00A0\u00A0\u200A\u200A\u200A"
                - entity: binary_sensor.blinds_left_door_online
